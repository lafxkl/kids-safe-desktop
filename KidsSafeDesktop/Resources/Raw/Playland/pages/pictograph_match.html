<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <style>
    :root {
      --bg-body: #f4ede2;
      --card-back: linear-gradient(135deg, #b45309, #78350f);
      --card-front: #ffffff;
      --primary: #92400e;
      --accent: #d97706;
      --text-main: #332014;
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      background: var(--bg-body);
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(217, 119, 6, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(180, 83, 9, 0.15) 0%, transparent 45%),
        radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.7) 0%, transparent 80%);
      font-family: -apple-system, BlinkMacSystemFont, "STKaiti", "KaiTi", "PingFang SC", "Microsoft YaHei", serif;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 14px;
      overflow-x: hidden;
    }

    /* 顶部导航 */
    .top-bar {
      width: 100%;
      max-width: 860px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 22px;
      font-weight: 800;
      color: #78350f;
    }

    .brand-badge {
      font-size: 11px;
      background: #b45309;
      color: #fff;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: normal;
      font-family: sans-serif;
    }

    .top-actions {
      display: flex;
      gap: 8px;
    }

    .nav-btn {
      background: #fff;
      border: 1px solid #dcd4c7;
      padding: 7px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      color: #78350f;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      text-decoration: none;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
      transition: all 0.2s;
    }
    .nav-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    /* 难度与状态控制栏 */
    .ctrl-strip {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 860px;
      margin-bottom: 14px;
      background: rgba(255, 255, 255, 0.85);
      padding: 8px 18px;
      border-radius: 24px;
      border: 1px solid #e7dfd3;
      box-shadow: 0 4px 12px rgba(120, 53, 15, 0.06);
    }

    .diff-group {
      display: flex;
      gap: 6px;
    }

    .diff-btn {
      background: #fdfaf4;
      border: 1px solid #dcd4c7;
      padding: 5px 14px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 700;
      color: #78350f;
      cursor: pointer;
      transition: all 0.2s;
    }
    .diff-btn.active {
      background: #78350f;
      color: #fff;
      border-color: #78350f;
    }

    .stats-info {
      display: flex;
      gap: 16px;
      font-size: 14px;
      font-weight: 700;
      color: #57331b;
      font-family: sans-serif;
    }

    /* 翻牌主舞台卡片矩阵 */
    .board-container {
      width: 100%;
      max-width: 860px;
      background: rgba(255, 255, 255, 0.9);
      border: 2px solid #e7dfd3;
      border-radius: var(--radius);
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 12px 30px rgba(120, 53, 15, 0.08);
    }

    .cards-grid {
      display: grid;
      gap: 14px;
      width: 100%;
      max-width: 720px;
      justify-content: center;
      perspective: 1000px;
    }

    .grid-4x2 { grid-template-columns: repeat(4, 1fr); }
    .grid-4x3 { grid-template-columns: repeat(4, 1fr); }
    .grid-4x4 { grid-template-columns: repeat(4, 1fr); }
    .grid-5x4 { grid-template-columns: repeat(5, 1fr); }

    /* 单张翻牌 */
    .card-item {
      aspect-ratio: 1;
      min-height: 95px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      cursor: pointer;
    }

    .card-item.flipped {
      transform: rotateY(180deg);
    }

    .card-item.matched {
      transform: rotateY(180deg) scale(0.96);
      pointer-events: none;
      opacity: 0.6;
    }

    .card-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 14px rgba(120, 53, 15, 0.1);
    }

    /* 背面 (未翻开) */
    .card-back {
      background: var(--card-back);
      border: 2px solid #d97706;
      color: #fef3c7;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-back-pattern {
      width: 44px;
      height: 44px;
      border: 2px dashed rgba(254, 243, 199, 0.4);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    /* 正面 (翻开后) */
    .card-front {
      background: #ffffff;
      border: 2px solid #b45309;
      transform: rotateY(180deg);
      padding: 6px;
    }

    /* 正面类型 1: 象形图画卡 */
    .pic-svg-box {
      width: 60px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .pic-svg-box svg {
      width: 100%;
      height: 100%;
    }
    .pic-label {
      font-size: 11px;
      color: #92400e;
      font-family: sans-serif;
      margin-top: 2px;
    }

    /* 正面类型 2: 汉字卡 */
    .char-pinyin {
      font-size: 13px;
      color: #b45309;
      font-family: sans-serif;
      font-weight: 700;
    }
    .char-hanzi {
      font-size: 40px;
      font-weight: 900;
      color: #78350f;
      line-height: 1;
      margin-top: 2px;
    }

    /* 错配晃动动画 */
    @keyframes cardShake {
      0%, 100% { transform: rotateY(180deg) translateX(0); }
      25% { transform: rotateY(180deg) translateX(-6px); }
      75% { transform: rotateY(180deg) translateX(6px); }
    }
    .card-item.shake {
      animation: cardShake 0.35s ease;
    }

    /* 通关弹窗 */
    .win-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
    }

    .win-card {
      background: #fdfaf4;
      border: 2px solid #b45309;
      border-radius: 24px;
      padding: 32px 24px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
    }

    .btn-replay {
      background: linear-gradient(135deg, #b45309, #78350f);
      color: #fff;
      border: none;
      padding: 11px 28px;
      border-radius: 20px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(180, 83, 9, 0.35);
      margin-top: 16px;
    }

    @media (max-width: 600px) {
      .cards-grid { gap: 8px; }
      .grid-5x4 { grid-template-columns: repeat(4, 1fr); }
      .card-item { min-height: 70px; }
      .pic-svg-box { width: 40px; height: 40px; }
      .char-hanzi { font-size: 26px; }
      .char-pinyin { font-size: 11px; }
      .board-container { padding: 10px; }
      .diff-btn { padding: 4px 8px; font-size: 12px; }
      .ctrl-strip { padding: 6px 12px; }
    }

  <script>
    // Web Audio 音效系统
    class SoundFX {
      constructor() {
        this.ctx = null;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') this.ctx.resume();
      }
      playFlip() {
        this.init();
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(400, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 0.1);
          gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.1);
        } catch(e) {}
      }
      playMatch() {
        this.init();
        try {
          [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
            setTimeout(() => {
              const osc = this.ctx.createOscillator();
              const gain = this.ctx.createGain();
              osc.type = 'triangle';
              osc.frequency.setValueAtTime(f, this.ctx.currentTime);
              gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
              gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
              osc.connect(gain);
              gain.connect(this.ctx.destination);
              osc.start();
              osc.stop(this.ctx.currentTime + 0.25);
            }, i * 80);
          });
        } catch(e) {}
      }
      playMismatch() {
        this.init();
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, this.ctx.currentTime);
          gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.25);
        } catch(e) {}
      }
    }

    // Fisher-Yates 真正均匀随机洗牌算法
    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    class PictographGame {
      constructor() {
        this.cardsGrid = document.getElementById('cardsGrid');
        this.stepCountEl = document.getElementById('stepCount');
        this.matchCountEl = document.getElementById('matchCount');
        this.winModal = document.getElementById('winModal');
        this.winSummary = document.getElementById('winSummary');

        this.pairCount = 4;
        this.steps = 0;
        this.matchedPairs = 0;
        this.flippedCards = [];
        this.isLocked = false;
        this.lastSelectedIds = new Set(); // 记录上一轮抽中的汉字，避免连续重复

        this.bindEvents();
        this.startNewGame(4);
      }

      bindEvents() {
        document.querySelectorAll('.diff-btn').forEach(btn => {
          btn.onclick = () => {
            document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const count = parseInt(btn.dataset.count);
            this.startNewGame(count);
          };
        });

        document.getElementById('btnPlayAgain').onclick = () => {
          this.winModal.style.display = 'none';
          this.startNewGame(this.pairCount);
        };
      }

      startNewGame(pairCount) {
        this.pairCount = pairCount;
        this.steps = 0;
        this.matchedPairs = 0;
        this.flippedCards = [];
        this.isLocked = false;

        this.stepCountEl.textContent = '0';
        this.matchCountEl.textContent = `0 / ${pairCount}`;

        // 智能轮换抽题算法：优先从上一轮未出现的字中抽取，彻底避免连续重复
        let pool = PICTOGRAPHS.filter(item => !this.lastSelectedIds.has(item.id));
        if (pool.length < pairCount) {
          const unusedIds = new Set(pool.map(p => p.id));
          const rest = PICTOGRAPHS.filter(item => !unusedIds.has(item.id));
          pool = pool.concat(shuffleArray(rest));
        }
        const selectedSet = shuffleArray(pool).slice(0, pairCount);
        this.lastSelectedIds = new Set(selectedSet.map(item => item.id));

        const cardDeck = [];
        selectedSet.forEach(item => {
          // 象形图卡
          cardDeck.push({
            id: item.id,
            type: "pic",
            data: item
          });
          // 现代汉字卡
          cardDeck.push({
            id: item.id,
            type: "char",
            data: item
          });
        });

        // 真实打乱卡片顺序
        const shuffledDeck = shuffleArray(cardDeck);

        // 调整网格类
        this.cardsGrid.className = 'cards-grid';
        if (pairCount === 4) this.cardsGrid.classList.add('grid-4x2');
        else if (pairCount === 6) this.cardsGrid.classList.add('grid-4x3');
        else if (pairCount === 8) this.cardsGrid.classList.add('grid-4x4');
        else this.cardsGrid.classList.add('grid-5x4');

        this.cardsGrid.innerHTML = '';
        shuffledDeck.forEach((cardData, idx) => {
          const cardEl = document.createElement('div');
          cardEl.className = 'card-item';
          cardEl.dataset.idx = idx;

          let frontContent = '';
          if (cardData.type === 'pic') {
            frontContent = `
              <div class="pic-svg-box">${cardData.data.svg}</div>
              <div class="pic-label">象形图</div>
            `;
          } else {
            frontContent = `
              <div class="char-pinyin">${cardData.data.pinyin}</div>
              <div class="char-hanzi">${cardData.data.char}</div>
            `;
          }

          cardEl.innerHTML = `
            <div class="card-face card-back">
              <div class="card-back-pattern">🀄</div>
            </div>
            <div class="card-face card-front">
              ${frontContent}
            </div>
          `;

          cardEl.onclick = () => this.handleCardClick(cardEl, cardData);
          this.cardsGrid.appendChild(cardEl);
        });
      }

      handleCardClick(cardEl, cardData) {
        if (this.isLocked || cardEl.classList.contains('flipped') || cardEl.classList.contains('matched')) {
          return;
        }

        sfx.playFlip();
        cardEl.classList.add('flipped');
        this.flippedCards.push({ cardEl, cardData });

        if (this.flippedCards.length === 2) {
          this.steps++;
          this.stepCountEl.textContent = this.steps;
          this.checkMatch();
        }
      }

      checkMatch() {
        this.isLocked = true;
        const [c1, c2] = this.flippedCards;

        if (c1.cardData.id === c2.cardData.id && c1.cardData.type !== c2.cardData.type) {
          // 配对成功！
          sfx.playMatch();
          setTimeout(() => {
            c1.cardEl.classList.add('matched');
            c2.cardEl.classList.add('matched');

            this.matchedPairs++;
            this.matchCountEl.textContent = `${this.matchedPairs} / ${this.pairCount}`;

            // 语音讲解发音
            const item = c1.cardData.data;
            this.speakText(`${item.char}，${item.pinyin}。${item.desc}`);

            this.flippedCards = [];
            this.isLocked = false;

            if (this.matchedPairs === this.pairCount) {
              setTimeout(() => this.handleGameWin(), 500);
            }
          }, 350);
        } else {
          // 配对失败
          sfx.playMismatch();
          setTimeout(() => {
            c1.cardEl.classList.add('shake');
            c2.cardEl.classList.add('shake');

            setTimeout(() => {
              c1.cardEl.classList.remove('flipped', 'shake');
              c2.cardEl.classList.remove('flipped', 'shake');
              this.flippedCards = [];
              this.isLocked = false;
            }, 500);
          }, 450);
        }
      }

      handleGameWin() {
        this.winSummary.textContent = `太棒了！您只用了 ${this.steps} 步就成功识别了全部 ${this.pairCount} 组象形文字！`;
        this.winModal.style.display = 'flex';
      }

      speakText(text) {
        if (!('speechSynthesis' in window)) return;
        try {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = 'zh-CN';
          utterance.rate = 0.88;
          window.speechSynthesis.speak(utterance);
        } catch(e) {}
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      new PictographGame();
    });
  </script>
</body>
