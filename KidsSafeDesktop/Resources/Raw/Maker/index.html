<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>小游戏工坊</title>
<!--
  小游戏工坊 —— 家长自制网页小游戏的编辑器。

  为什么是「一个 HTML」：
    Windows / Android 走 WebView，Linux 走 QtWebEngine，鸿蒙走 ArkWeb，
    四个端的浏览器内核不同，但都是 Chromium 系。把编辑器做成零依赖的单文件，
    四条通路加载的是同一份代码，改一次四端同时生效，也不用为每端各写一套 UI。

  两条外部接口（都由宿主调用，页面不主动回调宿主，避免四端各写一套 JSBridge）：
    window.KS.importAsset(json)     宿主选完文件后调用：{name, mime, dataUrl}
    window.KS.currentProjectBase64() 宿主「导出作品」时调用，返回当前作品的 base64
    window.KS.loadProjectBase64(b64) 宿主「导入作品」时调用
  作品本身存在 localStorage；图片导入后压到 320px 以内再存，避免撑爆 5MB 配额。
-->
<style>
  :root{
    --bg:#F3F6FB; --card:#FFFFFF; --ink:#20304A; --sub:#6B7C93;
    --line:#DCE4EF; --brand:#3F51B5; --brand2:#5C6BC0; --ok:#2E7D32;
    --warn:#EF6C00; --shadow:0 6px 18px rgba(38,60,96,.10);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  /*
   * [hidden] 必须真的隐藏 —— 这条不能删，也不能往后挪。
   *
   * 浏览器默认样式里有一条 [hidden]{display:none}，但它属于**用户代理样式表**，
   * 作者样式表里任何一条 display 都能盖掉它（跟选择器优先级无关，只跟来源有关）。
   * 下面 .view / .studio / .sheet / .overlay / .row 全都写了 display:flex，
   * 于是 <div class="sheet" hidden> 照样铺满全屏、<div class="view" hidden>
   * 照样显示 —— 表现就是：一进工坊，「选择素材」的半透明遮罩永远压在最上层，
   * 大厅和编辑台同时出现，整页点不动。
   *
   * 用 !important 才能赢过那些 display:flex；这条必须放在所有组件样式之前，
   * 后面新写的类也就不会再犯同一个错。
   */
  [hidden]{display:none !important}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
    overscroll-behavior:none;
  }
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  input,select{font:inherit;color:inherit}

  .app{height:100%;display:flex;flex-direction:column}

  /* ---------- 顶栏 ---------- */
  header{
    flex:0 0 auto;display:flex;align-items:center;gap:8px;
    padding:10px 12px;background:var(--brand);color:#fff;
    padding-top:calc(10px + env(safe-area-inset-top));
  }
  header .back{width:38px;height:38px;border-radius:12px;font-size:20px;line-height:1}
  header .back:active{background:rgba(255,255,255,.18)}
  header .title{font-weight:700;font-size:17px;flex:0 0 auto}
  header .spacer{flex:1 1 auto}
  header .acts{display:flex;align-items:center;gap:8px;margin-left:auto;flex:0 0 auto}
  header .act{
    height:38px;padding:0 14px;border-radius:12px;background:rgba(255,255,255,.16);
    font-size:14px;font-weight:600;white-space:nowrap;
  }
  header .act.primary{background:#fff;color:var(--brand)}
  header .act:disabled{opacity:.45}

  /* ---------- 大厅 ---------- */
  .view{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
  .scroll{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px 28px}
  .sec-title{font-size:14px;font-weight:700;color:var(--sub);margin:6px 2px 10px;letter-spacing:.5px}
  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .tile{
    background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--shadow);
    display:flex;flex-direction:column;gap:6px;text-align:left;min-height:118px;
    border:2px solid transparent;transition:transform .08s;
  }
  .tile:active{transform:scale(.975)}
  .tile .emo{font-size:34px;line-height:1.1}
  .tile .nm{font-weight:700;font-size:15px}
  .tile .ds{font-size:12px;color:var(--sub);line-height:1.35}
  .tile.add{border:2px dashed #C3CEE0;background:transparent;box-shadow:none;align-items:center;justify-content:center}
  .tile.add .nm{color:var(--brand);font-size:14px}
  .empty{border:1px dashed #C3CEE0;border-radius:16px;padding:22px;text-align:center;color:var(--sub);font-size:13px}
  .hint{font-size:12px;color:var(--sub);line-height:1.6;margin:16px 2px 0}

  /* ---------- 编辑台 ---------- */
  .studio{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
  .stage-wrap{
    position:relative;flex:0 0 auto;margin:10px 12px 0;border-radius:18px;overflow:hidden;
    background:#0E1630;box-shadow:var(--shadow);aspect-ratio:4/3;max-height:52vh;
    display:flex;align-items:center;justify-content:center;
  }
  .stage-wrap canvas{width:100%;height:100%;display:block;touch-action:none}
  .overlay{
    position:absolute;inset:0;background:rgba(14,22,48,.78);color:#fff;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
    text-align:center;padding:18px;
  }
  .overlay .big{font-size:30px;font-weight:800}
  .overlay .sub{font-size:14px;opacity:.85}
  .overlay .row{display:flex;gap:10px;margin-top:4px;flex-wrap:wrap;justify-content:center}
  .overlay button{
    height:44px;padding:0 20px;border-radius:14px;background:rgba(255,255,255,.16);
    color:#fff;font-weight:700;font-size:15px;
  }
  .overlay button.primary{background:#fff;color:var(--brand)}

  .toast{
    position:absolute;left:50%;bottom:14px;transform:translateX(-50%);
    background:rgba(20,28,45,.9);color:#fff;font-size:13px;padding:9px 16px;
    border-radius:20px;max-width:90%;text-align:center;pointer-events:none;
  }

  .inspector{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;margin-top:10px}
  .tabs{display:flex;gap:8px;padding:0 12px 8px;flex:0 0 auto;overflow-x:auto}
  .tab{
    flex:0 0 auto;height:36px;padding:0 16px;border-radius:12px;background:#fff;
    color:var(--sub);font-size:14px;font-weight:600;box-shadow:0 2px 8px rgba(38,60,96,.06);
  }
  .tab.on{background:var(--brand);color:#fff}
  .panel{flex:1 1 auto;overflow-y:auto;padding:0 12px 20px}
  .card{background:#fff;border-radius:16px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
  .row{display:flex;align-items:center;gap:10px}
  .row .lab{flex:0 0 auto;font-size:14px;font-weight:600;min-width:74px}
  .row .val{flex:1 1 auto;text-align:right;font-size:13px;color:var(--sub)}
  input[type=range]{width:100%;accent-color:var(--brand);height:30px}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{
    display:flex;align-items:center;gap:8px;background:#F4F7FC;border:1px solid var(--line);
    border-radius:14px;padding:8px 12px;font-size:14px;font-weight:600;
  }
  .chip .ico{font-size:20px;line-height:1;display:inline-flex;width:22px;justify-content:center}
  .chip img{width:22px;height:22px;object-fit:contain;border-radius:5px}
  .chip .tag{font-size:11px;color:var(--sub);font-weight:400}
  .field{display:flex;flex-direction:column;gap:6px}
  .field .lab{font-size:13px;font-weight:600;color:var(--sub)}
  input[type=text]{
    height:44px;border-radius:12px;border:1px solid var(--line);background:#fff;padding:0 12px;
    width:100%;
  }
  .switch{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .switch input{width:48px;height:28px;accent-color:var(--brand)}
  .del{color:#C62828;font-size:13px;font-weight:600;text-align:center;padding:10px}

  /* ---------- 素材选择器 ---------- */
  .sheet{position:fixed;inset:0;background:rgba(14,22,48,.42);display:flex;align-items:flex-end;justify-content:center;z-index:50}
  .sheet-card{
    width:100%;max-width:720px;max-height:86vh;background:#fff;border-radius:20px 20px 0 0;
    display:flex;flex-direction:column;overflow:hidden;
  }
  .sheet-head{display:flex;align-items:center;gap:10px;padding:14px 16px 8px}
  .sheet-head b{font-size:16px;flex:1 1 auto}
  .sheet-head button{width:34px;height:34px;border-radius:10px;background:#F4F7FC;font-size:16px}
  .cats{display:flex;gap:8px;padding:0 16px 8px;overflow-x:auto;flex:0 0 auto}
  .cat{flex:0 0 auto;height:32px;padding:0 14px;border-radius:10px;background:#F4F7FC;color:var(--sub);font-size:13px;font-weight:600}
  .cat.on{background:#E8EAF6;color:var(--brand)}
  .grid{
    flex:1 1 auto;overflow-y:auto;padding:6px 16px 16px;
    display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:8px;align-content:start;
  }
  .gitem{
    aspect-ratio:1;border-radius:14px;background:#F7F9FD;border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:30px;overflow:hidden;
  }
  .gitem img{width:100%;height:100%;object-fit:contain;padding:6px}
  .gitem.on{border-color:var(--brand);box-shadow:0 0 0 2px rgba(63,81,181,.25)}
  .sheet-foot{padding:10px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);font-size:12px;color:var(--sub);line-height:1.5}
  /*
   * 窄屏（手机 / 小窗）下顶栏放不下「导入素材 · 保存 · 试玩」三个按钮，
   * 原来直接溢出到屏幕外面 —— 试玩按钮完全看不见，等于做完了没法试。
   * 这里让顶栏允许换行，按钮整体落到第二行；标题超长时省略，不挤掉按钮。
   */
  @media (max-width:560px){
    header{flex-wrap:wrap;row-gap:8px}
    header .title{flex:1 1 auto;min-width:0;overflow:hidden;
                  text-overflow:ellipsis;white-space:nowrap}
    header .spacer{flex:0 0 0}
    header .acts{flex:1 1 100%;justify-content:flex-end}
  }

  @media (min-width:760px){
    .studio{flex-direction:row;gap:12px;padding-right:12px}
    /*
     * 桌面上画布和右侧面板左右排，高度应该撑满整块区域。
     * 原来这里写着 max-height:56vh —— 那是给手机竖屏（画布在上、面板在下）
     * 用的上限，桌面沿用后画布只到屏幕 56% 高，底下一大片空白，看起来像
     * 布局没画完。改成 none，高度由 calc(100% - 10px) 决定。
     */
    .stage-wrap{flex:1 1 58%;margin-right:0;aspect-ratio:auto;
                height:calc(100% - 10px);max-height:none}
    .inspector{flex:1 1 42%;margin-top:10px}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <button class="back" id="backBtn" hidden title="返回作品列表">←</button>
    <div class="title" id="topTitle">🧩 小游戏工坊</div>
    <div class="spacer"></div>
    <!-- 三个按钮包一层：窄屏时整组换到第二行并靠右，
         而不是一个个散开（否则「保存」「试玩」会被挤出屏幕） -->
    <div class="acts">
      <button class="act" id="importBtn" hidden>📁 导入素材</button>
      <button class="act" id="saveBtn" hidden>💾 保存</button>
      <button class="act primary" id="playBtn" hidden>▶ 试玩</button>
    </div>
  </header>

  <!-- 大厅：新建 + 我的作品 -->
  <div class="view" id="libraryView">
    <div class="scroll">
      <div class="sec-title">新建一个游戏</div>
      <div class="tiles" id="newTiles"></div>

      <div class="sec-title" style="margin-top:22px">我的作品</div>
      <div class="tiles" id="projectGrid"></div>

      <p class="hint">
        做法：选一个玩法 → 挑角色和目标（可以点右上角「📁 导入素材」用自己的图片）→
        调速度和时长 → 试玩 → 保存。保存后回到这里就能打开继续改。
        <br>作品只存在这台设备上，不联网、不上传；需要备份时用右上角「导出」。
      </p>
    </div>
  </div>

  <!-- 编辑台 -->
  <div class="view studio" id="studioView" hidden>
    <div class="stage-wrap">
      <canvas id="stage"></canvas>
      <div class="overlay" id="overlay" hidden></div>
      <div class="toast" id="toast" hidden></div>
    </div>

    <div class="inspector">
      <div class="tabs" id="tabs">
        <button class="tab on" data-tab="play">玩法</button>
        <button class="tab" data-tab="look">角色</button>
        <button class="tab" data-tab="bg">场景</button>
      </div>

      <!-- 玩法参数 -->
      <div class="panel" data-panel="play">
        <div class="card">
          <div class="field">
            <span class="lab">游戏名字</span>
            <input type="text" id="nameInput" maxlength="16" placeholder="给游戏起个名字">
          </div>

          <div class="row"><span class="lab">速度</span><span class="val" id="speedVal">3</span></div>
          <input type="range" id="speed" min="1" max="10" step="1">

          <div class="row"><span class="lab">时长</span><span class="val" id="durVal">60 秒</span></div>
          <input type="range" id="duration" min="20" max="120" step="10">

          <div class="row" id="targetRow"><span class="lab">目标分</span><span class="val" id="goalVal">20 分</span></div>
          <input type="range" id="goal" min="5" max="60" step="5">

          <div class="row" id="livesRow" hidden><span class="lab">生命</span><span class="val" id="livesVal">3 条</span></div>
          <input type="range" id="lives" min="1" max="5" step="1" hidden>

          <div class="switch">
            <span class="lab" style="min-width:0">音效</span>
            <input type="checkbox" id="sound">
          </div>

          <button class="del" id="delBtn">删除这个作品</button>
        </div>
      </div>

      <!-- 角色与目标 -->
      <div class="panel" data-panel="look" hidden>
        <div class="card">
          <div class="chips" id="slotChips"></div>
          <p class="hint" style="margin:0">点一下换素材。内置的是表情符号，怎么放大都不糊；也可以导入自己的图片。</p>
        </div>
      </div>

      <!-- 背景 -->
      <div class="panel" data-panel="bg" hidden>
        <div class="card">
          <div class="chips" id="bgChips"></div>
          <p class="hint" style="margin:0">背景用纯色或渐变最稳，图片建议选横向大图（会自动铺满）。</p>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 素材选择器 -->
<div class="sheet" id="picker" hidden>
  <div class="sheet-card">
    <div class="sheet-head">
      <b id="pickerTitle">选择素材</b>
      <button id="pickerClose">✕</button>
    </div>
    <div class="cats" id="pickerCats"></div>
    <div class="grid" id="pickerGrid"></div>
    <div class="sheet-foot" id="pickerFoot">内置素材随编辑器一起打包，不联网也能用。导入的图片只存在本机。</div>
  </div>
</div>

<script>
'use strict';

/* ======================================================================
 * 0. 小工具
 * ==================================================================== */
const $ = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.prototype.slice.call((root || document).querySelectorAll(sel));

function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function uid() { return 'g' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

function toast(msg, ms) {
  const t = $('#toast');
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { t.hidden = true; }, ms || 1900);
}

/* UTF-8 ↔ base64：宿主拿到的必须是 base64，直接塞中文 JSON 会在跨语言边界上翻车 */
function b64encode(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  const CH = 0x8000;
  for (let i = 0; i < bytes.length; i += CH) {
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
  }
  return btoa(bin);
}
function b64decode(b64) {
  const bin = atob(b64.replace(/\s+/g, ''));
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

/* ======================================================================
 * 1. 内置素材
 *    用表情符号而不是图片：四端字体都能渲染，体积为零，缩放不糊。
 *    导入的图片另存到 localStorage，和内置素材一起出现在选择器里。
 * ==================================================================== */
const EMOJI = {
  '动物': ['🐱','🐶','🐰','🐼','🦊','🐸','🐵','🐷','🦁','🐯','🐨','🐮','🐔','🦄','🐢','🐳'],
  '水果': ['🍎','🍌','🍇','🍓','🍉','🍊','🍑','🍒','🥝','🍍','🥕','🍅','🌽','🍄'],
  '星星': ['⭐','🌟','✨','💫','🌙','☀️','🎈','🎁','🏆','💎','🔵','❤️'],
  '交通': ['🚗','🚕','🚌','🚑','🚒','🚀','✈️','🚁','🚲','🛴','⛵','🚂'],
  '怪兽': ['👾','👻','🎃','🦖','🐙','🦂','🕷️','🐊','🦇','💀'],
  '自然': ['🌸','🌻','🌵','🍀','🌈','❄️','🌊','🔥','⚡','🌰']
};

const BG_PRESETS = [
  { name: '暖黄', value: 'linear-gradient(160deg,#FFF6D8,#FFE0A3)' },
  { name: '晴空', value: 'linear-gradient(160deg,#E3F2FD,#9FD3FF)' },
  { name: '草地', value: 'linear-gradient(160deg,#E8F5E9,#A5D6A7)' },
  { name: '晚霞', value: 'linear-gradient(160deg,#FFE0EC,#FFB3C6)' },
  { name: '星空', value: 'linear-gradient(160deg,#2B3A67,#151E3F)' },
  { name: '深海', value: 'linear-gradient(160deg,#0B3C5D,#328CC1)' },
  { name: '纯白', value: '#FFFFFF' },
  { name: '浅灰', value: '#ECEFF1' }
];

/* 玩法模板：速度/时长等默认值都写在这里，新建时直接拷贝 */
const TEMPLATES = {
  catch: {
    name: '接住掉落', emoji: '🧺',
    desc: '左右移动，接住掉下来的好东西',
    hero: '🐱', target: '🍎', hazard: '',
    speed: 3, duration: 60, goal: 20, lives: 3
  },
  dodge: {
    name: '躲开障碍', emoji: '🏃',
    desc: '左右躲闪，别撞上掉下来的障碍',
    hero: '🐰', target: '⭐', hazard: '🪨',
    speed: 4, duration: 60, goal: 30, lives: 3
  },
  tap: {
    name: '点一点', emoji: '👆',
    desc: '看到目标就点，比谁手快',
    hero: '', target: '🎈', hazard: '',
    speed: 3, duration: 45, goal: 15, lives: 3
  }
};

/* ======================================================================
 * 2. 存档
 * ==================================================================== */
const STORE_KEY = 'ks.maker.v1';
const ASSET_KEY = 'ks.maker.assets.v1';

/*
 * 存档后端。
 *
 * 正常情况下就是 localStorage。但鸿蒙（ArkWeb）加载 resource://rawfile 页面时
 * 不一定给 opaquestorage，localStorage 可能是「写进去、下次读空」——
 * 那等于家长做的作品每次重开就没了，这是最不能接受的失败方式。
 * 所以宿主可以用 javaScriptProxy 注入一个 window.KSStore（get/set/remove 三个方法，
 * 落 @ohos.data.preferences），存在时优先走它。
 *
 * 这个适配层只在四处调用点用，不改变原有存储键，PC/安卓/Linux 行为完全不变。
 */
const LS = {
  get(key) {
    try {
      if (window.KSStore && typeof window.KSStore.get === 'function') {
        const v = window.KSStore.get(key);
        if (v !== null && v !== undefined && v !== '') return v;
      }
    } catch (e) { /* 桥坏了就退回 localStorage */ }
    try { return localStorage.getItem(key); } catch (e) { return null; }
  },
  set(key, value) {
    try {
      if (window.KSStore && typeof window.KSStore.set === 'function') {
        window.KSStore.set(key, value);
        return;
      }
    } catch (e) { /* 同上 */ }
    localStorage.setItem(key, value);
  }
};

function loadProjects() {
  try {
    const raw = LS.get(STORE_KEY);
    const arr = raw ? JSON.parse(raw) : [];
    return Array.isArray(arr) ? arr : [];
  } catch (e) { return []; }
}
function saveProjects(list) {
  try { LS.set(STORE_KEY, JSON.stringify(list)); return true; }
  catch (e) { toast('存不下了：图片太多或太大，删掉几个作品再试'); return false; }
}
function loadMyAssets() {
  try {
    const raw = LS.get(ASSET_KEY);
    const arr = raw ? JSON.parse(raw) : [];
    return Array.isArray(arr) ? arr : [];
  } catch (e) { return []; }
}
function saveMyAssets(list) {
  try { LS.set(ASSET_KEY, JSON.stringify(list)); return true; }
  catch (e) { return false; }
}

let projects = loadProjects();
let myAssets = loadMyAssets();
let current = null;      // 正在编辑的作品
let dirty = false;

/* ======================================================================
 * 3. 资源绘制（emoji 或图片）
 * ==================================================================== */
const imgCache = new Map();

function makeAsset(type, value, name) {
  return { type: type === 'image' ? 'image' : 'emoji', value: value, name: name || '' };
}

/**
 * 把导入的图片入库，并顺手换到当前槽位。
 * 同名覆盖：家长重导同一张图不会在「我的素材」里堆一串。
 */
function storeAsset(name, dataUrl) {
  const asset = { name: name || '我的图片', value: dataUrl, kind: 'image' };
  const i = myAssets.findIndex(a => a.kind === 'image' && a.name === asset.name);
  if (i >= 0) myAssets[i] = asset; else myAssets.push(asset);
  while (myAssets.length > 24) myAssets.shift();   // 最多留 24 张，超了挤掉最早的

  if (!saveMyAssets(myAssets)) {
    toast('存不下了：先删几个作品或素材再导入');
    return;
  }
  if (current) {
    const slot = pickerSlot || (current.template === 'tap' ? 'target' : 'hero');
    current[slot] = makeAsset('image', dataUrl, asset.name);
    dirty = true;
    renderSlotChips();
    persistCurrent();
    toast('已导入「' + asset.name + '」，已换到' + slotLabel(slot));
  } else {
    toast('已导入「' + asset.name + '」，新建游戏时就能选它');
  }
  if (!$('#picker').hidden) renderPicker();
}

function assetImage(a) {
  if (!a || a.type !== 'image') return null;
  if (imgCache.has(a.value)) return imgCache.get(a.value);
  const img = new Image();
  img.src = a.value;
  imgCache.set(a.value, img);
  return img;
}

/** 在画布上画一个素材：emoji 用字体，图片用 drawImage（还没解码完就退回 ✨）。 */
function drawAsset(ctx, a, x, y, size) {
  if (!a) return;
  if (a.type === 'image') {
    const img = assetImage(a);
    if (img && img.complete && img.naturalWidth > 0) {
      const ratio = img.naturalWidth / img.naturalHeight;
      let w = size, h = size;
      if (ratio > 1) h = size / ratio; else w = size * ratio;
      ctx.drawImage(img, x - w / 2, y - h / 2, w, h);
      return;
    }
  }
  ctx.font = Math.round(size) + 'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(a.value || '✨', x, y);
}

/* ======================================================================
 * 4. 音效（WebAudio 合成，不打包任何音频文件）
 * ==================================================================== */
const Sound = {
  ctx: null,
  enabled: true,
  wake() {
    if (!this.enabled) return null;
    try {
      if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (this.ctx.state === 'suspended') this.ctx.resume();
      return this.ctx;
    } catch (e) { return null; }
  },
  blip(freq, ms, type, gain) {
    const ctx = this.wake();
    if (!ctx) return;
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    g.gain.value = gain === undefined ? 0.09 : gain;
    osc.connect(g).connect(ctx.destination);
    const t = ctx.currentTime;
    g.gain.setValueAtTime(g.gain.value, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + (ms || 120) / 1000);
    osc.start(t);
    osc.stop(t + (ms || 120) / 1000 + 0.02);
  },
  hit() { this.blip(880, 90, 'triangle', 0.10); },
  miss() { this.blip(180, 160, 'sawtooth', 0.07); },
  over() { this.blip(520, 120, 'sine', 0.10); setTimeout(() => this.blip(392, 260, 'sine', 0.10), 130); }
};

/* ======================================================================
 * 5. 游戏引擎
 *    预览态和试玩态跑同一套逻辑：preview 时英雄自动移动、不记分、不会结束。
 * ==================================================================== */
const canvas = $('#stage');
const ctx = canvas.getContext('2d');

const stage = {
  w: 480, h: 360, dpr: 1,
  raf: 0, last: 0,
  mode: 'idle',            // 'idle' | 'preview' | 'play'
  entities: [],
  hero: null,
  score: 0, miss: 0, lives: 3, timeLeft: 0,
  spawnTimer: 0,
  heroTargetX: null,
  over: false,
  paused: false
};

function resizeCanvas() {
  const wrap = canvas.parentElement;
  const rect = wrap.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  const w = Math.max(220, Math.round(rect.width));
  const h = Math.max(160, Math.round(rect.height));
  stage.w = w;
  stage.h = h;
  stage.dpr = dpr;
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function heroSize() { return clamp(stage.w * 0.13, 34, 84); }
function itemSize() { return clamp(stage.w * 0.09, 24, 60); }

function resetStage() {
  stage.entities = [];
  stage.score = 0;
  stage.miss = 0;
  stage.timeLeft = (current && current.duration) || 60;
  stage.lives = (current && current.lives) || 3;
  stage.spawnTimer = 0;
  stage.over = false;
  stage.heroTargetX = null;
  stage.hero = {
    x: stage.w / 2,
    y: stage.h - heroSize() * 0.75,
    size: heroSize(),
    vx: 0
  };
}

function spawnEntity(kind) {
  const size = itemSize();
  const t = current.template;
  const isHazard = kind === 'hazard';
  const asset = isHazard ? current.hazard : current.target;
  const base = stage.w * 0.02;

  if (t === 'tap') {
    // 点一点：目标出现在画布中间区域，位置随机、不移动
    stage.entities.push({
      kind: kind, asset: asset, size: size * 1.25,
      x: size + Math.random() * Math.max(1, stage.w - size * 2),
      y: size + Math.random() * Math.max(1, stage.h - size * 2.4),
      vx: 0, vy: 0, born: performance.now()
    });
    return;
  }

  const speedBase = (current.speed || 3) * 26;
  const speed = isHazard ? speedBase * 1.15 : speedBase;
  stage.entities.push({
    kind: kind, asset: asset, size: size,
    x: size + Math.random() * Math.max(1, stage.w - size * 2),
    y: -size,
    vx: (Math.random() - 0.5) * base,
    vy: speed * (0.8 + Math.random() * 0.5),
    born: performance.now()
  });
}

function spawnInterval() {
  const s = current.speed || 3;
  return clamp(1.15 - s * 0.075, 0.30, 1.15);
}

function step(dt) {
  if (!current || stage.mode === 'idle') return;

  const playing = stage.mode === 'play';
  const t = current.template;

  // 计时只在实际试玩时走；预览无限循环
  if (playing && !stage.over) {
    stage.timeLeft -= dt;
    if (stage.timeLeft <= 0) {
      stage.timeLeft = 0;
      endGame('时间到');
      return;
    }
  }

  // 英雄跟随（触摸拖动或方向键都写进 heroTargetX）
  const hero = stage.hero;
  if (hero) {
    let want = stage.heroTargetX;
    if (want === null) {
      // 预览：自动追最近的目标，看起来像有人在玩
      want = autoHeroTarget(t);
    }
    const k = 1 - Math.pow(0.001, dt);       // 与帧率无关的插值
    hero.x += (want - hero.x) * clamp(k, 0, 1);
    hero.x = clamp(hero.x, hero.size / 2, stage.w - hero.size / 2);
  }

  // 生成
  stage.spawnTimer -= dt;
  if (stage.spawnTimer <= 0 && !stage.over) {
    stage.spawnTimer = spawnInterval();
    if (t === 'dodge') {
      spawnEntity('hazard');
      if (Math.random() < 0.35) spawnEntity('target');   // 兼顾收集
    } else if (t === 'tap') {
      if (stage.entities.filter(e => e.kind === 'target').length < 4) spawnEntity('target');
    } else {
      spawnEntity('target');
    }
  }

  // 移动与判定
  const hx = hero ? hero.x : stage.w / 2;
  const hy = hero ? hero.y : stage.h;
  const hs = hero ? hero.size : 0;

  for (let i = stage.entities.length - 1; i >= 0; i--) {
    const e = stage.entities[i];
    e.x += (e.vx || 0) * dt;
    e.y += (e.vy || 0) * dt;

    if (t === 'tap') {
      // 自己会消失，避免一直堆着
      if (playing && performance.now() - e.born > 4000) {
        stage.entities.splice(i, 1);
      }
      continue;
    }

    if (e.y - e.size / 2 > stage.h + e.size) {
      // 落地
      stage.entities.splice(i, 1);
      if (!playing) continue;
      if (e.kind === 'target') {
        stage.miss++;
        Sound.miss();
        if (t === 'catch' && stage.miss >= 3) { endGame('漏掉太多了'); return; }
      }
      continue;
    }

    if (!playing) continue;

    // 碰撞（矩形近似，孩子游戏够用）
    const dx = Math.abs(e.x - hx);
    const dy = Math.abs(e.y - hy);
    if (dx < (e.size + hs) / 2 * 0.78 && dy < (e.size + hs) / 2 * 0.78) {
      if (e.kind === 'target') {
        stage.entities.splice(i, 1);
        stage.score += 1;
        Sound.hit();
        if (t === 'catch' && stage.score >= (current.goal || 20)) { endGame('完成目标'); return; }
      } else if (e.kind === 'hazard') {
        stage.entities.splice(i, 1);
        stage.lives--;
        Sound.miss();
        if (stage.lives <= 0) { endGame('生命用完了'); return; }
      }
    }
  }
}

/** 预览时英雄追谁：接住玩法追最近的目标，躲避玩法躲最近的障碍。 */
function autoHeroTarget(t) {
  const hero = stage.hero;
  if (!hero) return stage.w / 2;
  if (t === 'tap') {
    return stage.w / 2 + Math.sin(performance.now() / 900) * stage.w * 0.18;
  }
  let best = null, bestD = Infinity;
  for (const e of stage.entities) {
    if (t === 'catch' && e.kind !== 'target') continue;
    if (t === 'dodge' && e.kind !== 'hazard') continue;
    if (e.y < 0 || e.y > stage.h) continue;
    const d = e.y; // 越靠下越紧急
    if (d < bestD) { bestD = d; best = e; }
  }
  if (!best) return stage.w / 2;
  if (t === 'dodge') {
    // 往障碍的反方向让开
    const away = best.x < stage.w / 2 ? best.x + stage.w * 0.36 : best.x - stage.w * 0.36;
    return clamp(away, hero.size / 2, stage.w - hero.size / 2);
  }
  return best.x;
}

function paint() {
  if (!current) return;
  const w = stage.w, h = stage.h;
  ctx.clearRect(0, 0, w, h);

  // 背景：纯色或渐变用 CSS 渐变字符串没法直接给 canvas，这里用简单双色近似
  const bg = current ? current.bg : { type: 'color', value: '#FFF8E1' };
  if (bg.type === 'image') {
    const img = assetImage(bg);
    if (img && img.complete && img.naturalWidth > 0) {
      const r = Math.max(w / img.naturalWidth, h / img.naturalHeight);
      const dw = img.naturalWidth * r, dh = img.naturalHeight * r;
      ctx.drawImage(img, (w - dw) / 2, (h - dh) / 2, dw, dh);
    } else {
      ctx.fillStyle = '#FFF8E1';
      ctx.fillRect(0, 0, w, h);
    }
  } else {
    const fill = paintBackground(ctx, bg.value, w, h);
    if (!fill) { ctx.fillStyle = bg.value || '#FFF8E1'; ctx.fillRect(0, 0, w, h); }
  }

  // 实体
  for (const e of stage.entities) {
    drawAsset(ctx, e.asset, e.x, e.y, e.size);
  }

  // 英雄
  if (stage.hero && current.hero && current.hero.value) {
    drawAsset(ctx, current.hero, stage.hero.x, stage.hero.y, stage.hero.size);
  }

  // 抬头显示（试玩时才显示分数，预览保持干净）
  if (stage.mode === 'play' && !stage.over) {
    ctx.save();
    ctx.fillStyle = 'rgba(20,28,45,.55)';
    const bw = 132, bh = 34;
    roundRect(ctx, 10, 10, bw, bh, 12);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 16px system-ui,sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText('⭐ ' + stage.score, 22, 28);

    // 计时
    ctx.fillStyle = 'rgba(20,28,45,.55)';
    roundRect(ctx, w - 92, 10, 82, 34, 12);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.fillText(Math.ceil(stage.timeLeft) + 's', w - 51, 28);
    ctx.restore();
  }
}

/** 画 CSS 线性渐变（只支持两色，够用），返回是否成功。 */
function paintBackground(c, value, w, h) {
  if (typeof value !== 'string' || value.indexOf('linear-gradient') !== 0) return false;
  const m = value.match(/linear-gradient\(\s*[\d.]+deg\s*,\s*(#[0-9a-fA-F]{3,8})\s*,\s*(#[0-9a-fA-F]{3,8})\s*\)/);
  if (!m) return false;
  const g = ctx.createLinearGradient(0, 0, w * 0.35, h);
  g.addColorStop(0, m[1]);
  g.addColorStop(1, m[2]);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);
  return true;
}

function roundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

function loop(ts) {
  stage.raf = requestAnimationFrame(loop);
  if (!stage.last) stage.last = ts;
  let dt = (ts - stage.last) / 1000;
  stage.last = ts;
  if (dt > 0.05) dt = 0.05;     // 切后台回来别让物体瞬移
  if (!stage.paused) step(dt);
  paint();
}

function startLoop() {
  if (stage.raf) return;
  stage.last = 0;
  stage.raf = requestAnimationFrame(loop);
}
function stopLoop() {
  if (stage.raf) cancelAnimationFrame(stage.raf);
  stage.raf = 0;
  stage.last = 0;
}

function startPreview() {
  if (!current) return;
  stage.mode = 'preview';
  stage.paused = false;
  resetStage();
  overlay.hide();
  startLoop();
}

function startPlay() {
  if (!current) return;
  saveFromForm();
  stage.mode = 'play';
  stage.paused = false;
  resetStage();
  Sound.wake();
  overlay.hide();
  startLoop();
}

function endGame(reason) {
  stage.over = true;
  stage.mode = 'play';
  Sound.over();
  overlay.show(
    '🎉 结束啦',
    (reason || '') + '　得分 ' + stage.score,
    [
      { text: '再来一局', primary: true, run: startPlay },
      { text: '回到编辑', run: () => { stopLoop(); startPreview(); } }
    ]
  );
}

/* 输入：拖动 / 方向键 / 点击目标 */
function canvasPoint(ev) {
  const r = canvas.getBoundingClientRect();
  const p = ev.touches ? ev.touches[0] : ev;
  return { x: p.clientX - r.left, y: p.clientY - r.top };
}

canvas.addEventListener('pointerdown', ev => {
  if (!current) return;
  canvas.setPointerCapture(ev.pointerId);
  const p = canvasPoint(ev);

  if (current.template === 'tap') {
    // 点一点：命中判定
    if (stage.mode === 'play' && !stage.over) {
      for (let i = stage.entities.length - 1; i >= 0; i--) {
        const e = stage.entities[i];
        if (Math.hypot(e.x - p.x, e.y - p.y) < e.size * 0.7) {
          stage.entities.splice(i, 1);
          stage.score++;
          Sound.hit();
          if (stage.score >= (current.goal || 15)) endGame('完成目标');
          return;
        }
      }
    }
    return;
  }

  stage.heroTargetX = p.x;
  Sound.wake();
});

canvas.addEventListener('pointermove', ev => {
  if (current && current.template === 'tap') return;
  if (ev.buttons === 0 && ev.pointerType === 'mouse') return;
  const p = canvasPoint(ev);
  stage.heroTargetX = p.x;
});

canvas.addEventListener('pointerup', () => {
  // 松手后由预览逻辑接管；试玩时停在原地，避免“自动跑”
});

window.addEventListener('keydown', ev => {
  if (!stage.hero) return;
  const stepX = stage.w * 0.07;
  if (ev.key === 'ArrowLeft' || ev.key === 'a') {
    stage.heroTargetX = clamp((stage.heroTargetX === null ? stage.hero.x : stage.heroTargetX) - stepX, 0, stage.w);
  } else if (ev.key === 'ArrowRight' || ev.key === 'd') {
    stage.heroTargetX = clamp((stage.heroTargetX === null ? stage.hero.x : stage.heroTargetX) + stepX, 0, stage.w);
  }
});

/* ======================================================================
 * 6. 覆盖层
 * ==================================================================== */
const overlay = {
  show(title, sub, buttons) {
    const box = $('#overlay');
    box.innerHTML = '';
    const h = document.createElement('div');
    h.className = 'big';
    h.textContent = title;
    box.appendChild(h);
    if (sub) {
      const p = document.createElement('div');
      p.className = 'sub';
      p.textContent = sub;
      box.appendChild(p);
    }
    const row = document.createElement('div');
    row.className = 'row';
    (buttons || []).forEach(b => {
      const btn = document.createElement('button');
      btn.textContent = b.text;
      if (b.primary) btn.className = 'primary';
      btn.onclick = b.run;
      row.appendChild(btn);
    });
    box.appendChild(row);
    box.hidden = false;
  },
  hide() { $('#overlay').hidden = true; }
};

/* ======================================================================
 * 7. 大厅
 * ==================================================================== */
function renderLibrary() {
  const tiles = $('#newTiles');
  tiles.innerHTML = '';
  Object.keys(TEMPLATES).forEach(key => {
    const t = TEMPLATES[key];
    const b = document.createElement('button');
    b.className = 'tile';
    b.innerHTML = '<div class="emo">' + t.emoji + '</div>' +
                  '<div class="nm">' + t.name + '</div>' +
                  '<div class="ds">' + t.desc + '</div>';
    b.onclick = () => createProject(key);
    tiles.appendChild(b);
  });

  const grid = $('#projectGrid');
  grid.innerHTML = '';
  if (!projects.length) {
    const d = document.createElement('div');
    d.className = 'empty';
    d.textContent = '还没有作品，先选上面的玩法做一个吧。';
    grid.appendChild(d);
  } else {
    projects.slice().sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0)).forEach(p => {
      const b = document.createElement('button');
      b.className = 'tile';
      b.innerHTML = '<div class="emo">' + (TEMPLATES[p.template] ? TEMPLATES[p.template].emoji : '🎮') + '</div>' +
                    '<div class="nm">' + escapeHtml(p.name) + '</div>' +
                    '<div class="ds">' + (TEMPLATES[p.template] ? TEMPLATES[p.template].name : '小游戏') +
                    ' · ' + (p.duration || 60) + ' 秒</div>';
      b.onclick = () => openProject(p.id);
      grid.appendChild(b);
    });
  }
}

function escapeHtml(s) {
  return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, c => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}

function blankProject(template) {
  const t = TEMPLATES[template];
  return {
    id: uid(),
    name: t.name + '游戏',
    template: template,
    hero: makeAsset('emoji', t.hero),
    target: makeAsset('emoji', t.target),
    hazard: makeAsset('emoji', t.hazard || '🪨'),
    bg: { type: 'color', value: BG_PRESETS[0].value },
    speed: t.speed,
    duration: t.duration,
    goal: t.goal,
    lives: t.lives,
    sound: true,
    updatedAt: Date.now()
  };
}

function createProject(template) {
  const p = blankProject(template);
  projects.push(p);
  saveProjects(projects);
  openProject(p.id);
}

function openProject(id) {
  const p = projects.find(x => x.id === id);
  if (!p) return;
  // 补字段：老作品缺新字段时不让界面炸
  p.hero = p.hero || makeAsset('emoji', '🐱');
  p.target = p.target || makeAsset('emoji', '🍎');
  p.hazard = p.hazard || makeAsset('emoji', '🪨');
  p.bg = p.bg || { type: 'color', value: BG_PRESETS[0].value };
  p.speed = p.speed || 3;
  p.duration = p.duration || 60;
  p.goal = p.goal || 20;
  p.lives = p.lives || 3;

  current = p;
  dirty = false;
  $('#libraryView').hidden = true;
  $('#studioView').hidden = false;
  $('#backBtn').hidden = false;
  $('#saveBtn').hidden = false;
  $('#playBtn').hidden = false;
  $('#importBtn').hidden = false;
  $('#topTitle').textContent = '🧩 ' + p.name;

  fillForm();
  resizeCanvas();
  resetStage();
  startPreview();
}

function backToLibrary() {
  if (dirty) { /* 自动保存，家长不用记得点保存 */ saveFromForm(); persistCurrent(); }
  stopLoop();
  stage.mode = 'idle';
  overlay.hide();
  current = null;
  $('#studioView').hidden = true;
  $('#libraryView').hidden = false;
  $('#backBtn').hidden = true;
  $('#saveBtn').hidden = true;
  $('#playBtn').hidden = true;
  $('#importBtn').hidden = true;
  $('#topTitle').textContent = '🧩 小游戏工坊';
  renderLibrary();
}

/* ======================================================================
 * 8. 表单 ↔ 作品
 * ==================================================================== */
function fillForm() {
  const p = current;
  $('#nameInput').value = p.name;
  $('#speed').value = p.speed;
  $('#speedVal').textContent = p.speed;
  $('#duration').value = p.duration;
  $('#durVal').textContent = p.duration + ' 秒';
  $('#goal').value = p.goal;
  $('#goalVal').textContent = p.goal + ' 分';
  $('#lives').value = p.lives;
  $('#livesVal').textContent = p.lives + ' 条';
  $('#sound').checked = !!p.sound;
  Sound.enabled = !!p.sound;

  const isDodge = p.template === 'dodge';
  $('#livesRow').hidden = !isDodge;
  $('#lives').hidden = !isDodge;

  renderSlotChips();
  renderBgChips();
}

function saveFromForm() {
  if (!current) return;
  current.name = ($('#nameInput').value || '').trim().slice(0, 16) || '我的游戏';
  current.speed = +$('#speed').value;
  current.duration = +$('#duration').value;
  current.goal = +$('#goal').value;
  current.lives = +$('#lives').value;
  current.sound = $('#sound').checked;
  Sound.enabled = current.sound;
  current.updatedAt = Date.now();
  $('#topTitle').textContent = '🧩 ' + current.name;
  dirty = false;
}

function persistCurrent() {
  const i = projects.findIndex(x => x.id === current.id);
  if (i >= 0) projects[i] = current; else projects.push(current);
  return saveProjects(projects);
}

/*
 * 兜底存一次。
 *
 * 只在「回作品大厅」时存档是不够的：家长改完参数直接按 Home / 划掉应用是很常见的动作，
 * 安卓和鸿蒙的 WebView 在进程被杀之前不保证会走到 backToLibrary，
 * 结果就是「我明明调好了，下次打开又变回去了」。
 * pagehide 与 visibilitychange(hidden) 两个都挂：前者在页面真正卸载时触发，
 * 后者在切后台时触发（鸿蒙上更可靠），重复调用无副作用（dirty 为假就直接返回）。
 */
function flushSave() {
  if (!current || !dirty) return;
  try { saveFromForm(); persistCurrent(); } catch (e) { /* 存不下也不能在这里抛 */ }
}
window.addEventListener('pagehide', flushSave);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') flushSave();
});

/* 参数控件 */
['speed', 'duration', 'goal', 'lives'].forEach(id => {
  $('#' + id).addEventListener('input', () => {
    const v = +$('#' + id).value;
    if (id === 'speed') $('#speedVal').textContent = v;
    if (id === 'duration') $('#durVal').textContent = v + ' 秒';
    if (id === 'goal') $('#goalVal').textContent = v + ' 分';
    if (id === 'lives') $('#livesVal').textContent = v + ' 条';
    dirty = true;
  });
});
$('#sound').addEventListener('change', () => {
  Sound.enabled = $('#sound').checked;
  dirty = true;
  if (Sound.enabled) Sound.hit();
});
$('#nameInput').addEventListener('input', () => { dirty = true; });

$('#saveBtn').onclick = () => {
  saveFromForm();
  if (persistCurrent()) toast('已保存 ✓');
};
$('#backBtn').onclick = backToLibrary;
$('#playBtn').onclick = startPlay;
$('#delBtn').onclick = () => {
  if (!current) return;
  if (!confirm('删除「' + current.name + '」？删了就找不回来了。')) return;
  projects = projects.filter(x => x.id !== current.id);
  saveProjects(projects);
  current = null;
  dirty = false;
  backToLibrary();
};

/* ======================================================================
 * 9. 素材槽位
 * ==================================================================== */
function slotLabel(key) {
  return { hero: '主角', target: '目标', hazard: '障碍' }[key] || key;
}

function renderSlotChips() {
  const box = $('#slotChips');
  box.innerHTML = '';
  const slots = current.template === 'tap' ? ['target'] : ['hero', 'target'];
  if (current.template === 'dodge') slots.push('hazard');

  slots.forEach(key => {
    const a = current[key];
    const chip = document.createElement('button');
    chip.className = 'chip';
    chip.appendChild(assetThumb(a));
    const txt = document.createElement('span');
    txt.textContent = slotLabel(key);
    chip.appendChild(txt);
    const tag = document.createElement('span');
    tag.className = 'tag';
    tag.textContent = a.type === 'image' ? '图片' : '内置';
    chip.appendChild(tag);
    chip.onclick = () => openPicker(key);
    box.appendChild(chip);
  });
}

function assetThumb(a) {
  const span = document.createElement('span');
  span.className = 'ico';
  if (a && a.type === 'image') {
    const img = document.createElement('img');
    img.src = a.value;
    span.appendChild(img);
  } else {
    span.textContent = (a && a.value) || '❓';
  }
  return span;
}

function renderBgChips() {
  const box = $('#bgChips');
  box.innerHTML = '';
  BG_PRESETS.forEach(p => {
    const chip = document.createElement('button');
    chip.className = 'chip';
    const sw = document.createElement('span');
    sw.style.cssText = 'width:22px;height:22px;border-radius:6px;border:1px solid #DCE4EF;background:' + p.value;
    chip.appendChild(sw);
    const t = document.createElement('span');
    t.textContent = p.name;
    chip.appendChild(t);
    if (current.bg.type !== 'image' && current.bg.value === p.value) chip.style.borderColor = '#3F51B5';
    chip.onclick = () => {
      current.bg = { type: 'color', value: p.value };
      dirty = true;
      renderBgChips();
      toast('背景已换');
    };
    box.appendChild(chip);
  });

  // 我的图片素材（背景）
  myAssets.filter(a => a.kind === 'image').slice(0, 8).forEach(a => {
    const chip = document.createElement('button');
    chip.className = 'chip';
    const img = document.createElement('img');
    img.src = a.value;
    img.style.cssText = 'width:26px;height:26px;object-fit:cover;border-radius:6px';
    chip.appendChild(img);
    const t = document.createElement('span');
    t.textContent = a.name || '我的图';
    chip.appendChild(t);
    chip.onclick = () => {
      current.bg = { type: 'image', value: a.value, name: a.name };
      dirty = true;
      toast('背景已换成自己的图片');
    };
    box.appendChild(chip);
  });
}

/* ======================================================================
 * 10. 素材选择器
 * ==================================================================== */
let pickerSlot = null;
let pickerCat = '动物';

function openPicker(slot) {
  pickerSlot = slot;
  $('#pickerTitle').textContent = '选择' + slotLabel(slot);
  $('#picker').hidden = false;
  renderPicker();
}

function renderPicker() {
  const cats = $('#pickerCats');
  cats.innerHTML = '';

  const names = Object.keys(EMOJI).concat(['我的素材']);
  names.forEach(name => {
    const b = document.createElement('button');
    b.className = 'cat' + (name === pickerCat ? ' on' : '');
    b.textContent = name === '我的素材' ? '📁 我的素材' : name;
    b.onclick = () => { pickerCat = name; renderPicker(); };
    cats.appendChild(b);
  });

  const grid = $('#pickerGrid');
  grid.innerHTML = '';

  const list = pickerCat === '我的素材'
    ? myAssets.filter(a => a.kind === 'image')
    : (EMOJI[pickerCat] || []).map(v => ({ value: v, type: 'emoji' }));

  if (!list.length) {
    const d = document.createElement('div');
    d.className = 'empty';
    d.style.gridColumn = '1 / -1';
    d.textContent = '还没有自己的素材。点右上角「📁 导入素材」选图片，导入后会出现在这里。';
    grid.appendChild(d);
    return;
  }

  list.forEach(item => {
    const b = document.createElement('button');
    b.className = 'gitem';
    if (item.type === 'image') {
      const img = document.createElement('img');
      img.src = item.value;
      b.appendChild(img);
    } else {
      b.textContent = item.value;
    }
    const cur = current[pickerSlot];
    if (cur && cur.type === item.type && cur.value === item.value) b.classList.add('on');
    b.onclick = () => {
      current[pickerSlot] = item.type === 'image'
        ? makeAsset('image', item.value, item.name)
        : makeAsset('emoji', item.value);
      dirty = true;
      renderSlotChips();
      closePicker();
      toast('已换上');
    };
    grid.appendChild(b);
  });
}

function closePicker() { $('#picker').hidden = true; }
$('#pickerClose').onclick = closePicker;
$('#picker').addEventListener('click', ev => {
  if (ev.target.id === 'picker') closePicker();
});

/* ======================================================================
 * 11. 标签页
 * ==================================================================== */
$$('#tabs .tab').forEach(tab => {
  tab.onclick = () => {
    $$('#tabs .tab').forEach(t => t.classList.toggle('on', t === tab));
    $$('.panel').forEach(p => { p.hidden = p.getAttribute('data-panel') !== tab.getAttribute('data-tab'); });
  };
});

/* ======================================================================
 * 12. 宿主接口
 * ==================================================================== */
window.KS = {
  /**
   * 宿主选完文件后调用（只收图片；游戏里的声音由编辑器自己合成，不需要素材文件）。
   * @param {string|object} payloadJson {name, mime, dataUrl}
   */
  importAsset(payloadJson) {
    try {
      const p = typeof payloadJson === 'string' ? JSON.parse(payloadJson) : payloadJson;
      if (!p || !p.dataUrl) return 'bad-payload';
      if ((p.mime || '').indexOf('image') !== 0) return 'unsupported';

      // 压到 320px 再存：相机原图 4MB 直接塞 localStorage 会撑爆整个存档。
      compressImage(p.dataUrl, 320, 0.82)
        .then(url => storeAsset(p.name, url))
        .catch(() => toast('这张图读不出来，换一张试试'));
      return 'ok';
    } catch (e) {
      return 'error:' + e.message;
    }
  },

  /** 宿主「导出作品」：返回当前作品的 base64（UTF-8 JSON）。 */
  currentProjectBase64() {
    try {
      if (!current) return '';
      saveFromForm();
      return b64encode(JSON.stringify(current, null, 2));
    } catch (e) { return ''; }
  },

  /** 宿主「导入作品」：base64 → 作品，追加到列表并打开。 */
  loadProjectBase64(b64) {
    try {
      const p = JSON.parse(b64decode(b64));
      if (!p || !p.template) return 'bad-project';
      p.id = uid();                    // 换新 id，避免覆盖同名作品
      p.updatedAt = Date.now();
      projects.push(p);
      saveProjects(projects);
      openProject(p.id);
      toast('已导入：' + (p.name || '作品'));
      return 'ok';
    } catch (e) { return 'error:' + e.message; }
  },

  /** 当前作品名（宿主导出时用来取文件名，省得它解 base64 时把中文弄乱）。 */
  projectName() {
    try {
      if (!current) return '';
      saveFromForm();
      return current.name || '我的小游戏';
    } catch (e) { return ''; }
  },

  /** 宿主导航回大厅（鸿蒙返回键等场景）。 */
  goLibrary() { backToLibrary(); return 'ok'; },

  /** 让页面自己知道被宿主接管了：隐藏「导入」提示里的浏览器说明。 */
  hostReady() { return 'ok'; }
};

/* ======================================================================
 * 13. 启动
 * ==================================================================== */
function boot() {
  // 第一次打开送一个样品，家长能立刻看到「做完是什么样」
  if (!projects.length) {
    const demo = blankProject('catch');
    demo.name = '样品：接苹果';
    projects.push(demo);
    saveProjects(projects);
    current = null;
  }
  renderLibrary();

  $('#importBtn').onclick = () => {
    // 页面自己没法叫起系统文件选择器（四端不一致），提示家长用右上角的宿主按钮
    toast('用窗口右上角的「导入素材」选图片；浏览器里可直接拖入图片', 2600);
  };

  const ro = new ResizeObserver(() => {
    if (current) resizeCanvas();
  });
  ro.observe(canvas.parentElement);

  window.addEventListener('resize', () => { if (current) resizeCanvas(); });

  // 浏览器里直接打开时，支持把图片拖进来
  document.addEventListener('dragover', ev => ev.preventDefault());
  document.addEventListener('drop', ev => {
    ev.preventDefault();
    const f = ev.dataTransfer && ev.dataTransfer.files && ev.dataTransfer.files[0];
    if (!f || f.type.indexOf('image') !== 0) return;
    const reader = new FileReader();
    reader.onload = () => {
      // 网页版没有宿主，自己压缩
      compressImage(reader.result, 320, 0.82).then(url => {
        window.KS.importAsset(JSON.stringify({ name: f.name, mime: f.type, dataUrl: url }));
      }).catch(() => toast('这张图读不出来'));
    };
    reader.readAsDataURL(f);
  });
}

/** 把图片压到长边 maxSize 以内，localStorage 才放得下。宿主端也会调这个。 */
window.KS.compressImage = compressImage;
function compressImage(dataUrl, maxSize, quality) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, (maxSize || 320) / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.max(1, Math.round(img.naturalWidth * scale));
      const h = Math.max(1, Math.round(img.naturalHeight * scale));
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const cx = c.getContext('2d');
      cx.drawImage(img, 0, 0, w, h);
      try { resolve(c.toDataURL('image/png')); }
      catch (e) { resolve(dataUrl); }
    };
    img.onerror = reject;
    img.src = dataUrl;
  });
}

boot();
</script>
