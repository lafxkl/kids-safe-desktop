<svg xmlns="http://www.w3.org/2000/svg" width="80" height="20" role="img" aria-label="license: MIT">
  <title>license: MIT</title>
  <linearGradient id="s" x2="0" y2="100%">
    <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
    <stop offset="1" stop-opacity=".1"/>
  </linearGradient>
  <clipPath id="r"><rect width="80" height="20" rx="3" fill="#fff"/></clipPath>
  <g clip-path="url(#r)">
    <rect width="49" height="20" fill="#555"/>
    <rect x="49" width="31" height="20" fill="#4c1"/>
    <rect width="80" height="20" fill="url(#s)"/>
  </g>
  <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="11">
    <text x="24.5" y="15" fill="#010101" fill-opacity=".3" textLength="39" lengthAdjust="spacingAndGlyphs">license</text>
    <text x="24.5" y="14" textLength="39" lengthAdjust="spacingAndGlyphs">license</text>
    <text x="64.5" y="15" fill="#010101" fill-opacity=".3" textLength="21" lengthAdjust="spacingAndGlyphs">MIT</text>
    <text x="64.5" y="14" textLength="21" lengthAdjust="spacingAndGlyphs">MIT</text>
  </g>
</svg>
