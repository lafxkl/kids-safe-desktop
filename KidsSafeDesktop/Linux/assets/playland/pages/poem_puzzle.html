<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>📜 点字成诗 · 诗词大闯关 - 智趣游戏乐园</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #fdfbf7 0%, #ebedee 100%);
      --card-bg: rgba(255, 255, 255, 0.92);
      --primary-color: #2b5876;
      --accent-color: #c0392b;
      --gold-color: #d4af37;
      --text-main: #2c3e50;
      --text-sub: #7f8c8d;
      --slot-bg: #eef2f5;
      --slot-border: #bdc3c7;
      --char-bg: linear-gradient(145deg, #ffffff, #f0f4f8);
      --char-shadow: 0 6px 14px rgba(43, 88, 118, 0.15);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      background: #f4ede2;
      background-image: 
        radial-gradient(at 10% 20%, rgba(220, 230, 222, 0.6) 0px, transparent 50%),
        radial-gradient(at 90% 80%, rgba(243, 218, 190, 0.5) 0px, transparent 50%),
        radial-gradient(at 50% 50%, rgba(255, 255, 255, 0.8) 0px, transparent 80%);
      font-family: -apple-system, BlinkMacSystemFont, "Kaiti SC", "STKaiti", "KaiTi", "SimKai", "PingFang SC", "Microsoft YaHei", serif;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 14px;
      overflow-x: hidden;
    }

    /* 顶部导航条 */
    .top-bar {
      width: 100%;
      max-width: 900px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 22px;
      font-weight: 700;
      color: #2c3e50;
      letter-spacing: 1px;
    }

    .brand-badge {
      font-size: 11px;
      background: #c0392b;
      color: #fff;
      padding: 2px 8px;
      border-radius: 12px;
      font-family: sans-serif;
      font-weight: normal;
    }

    .nav-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .btn-act {
      background: #fff;
      border: 1px solid #d5dbdb;
      padding: 7px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      color: #34495e;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
      transition: all 0.2s ease;
      text-decoration: none;
    }
    .btn-act:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      border-color: #bdc3c7;
    }
    .btn-act.active {
      background: #2b5876;
      color: #fff;
      border-color: #2b5876;
      box-shadow: 0 3px 8px rgba(43, 88, 118, 0.25);
    }

    /* 主舞台卡片容器 */
    .poem-stage {
      width: 100%;
      max-width: 900px;
      background: var(--card-bg);
      border: 2px solid #e2d7c5;
      border-radius: var(--radius);
      box-shadow: 0 10px 30px rgba(80, 60, 40, 0.08);
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      backdrop-filter: blur(8px);
    }

    /* 水墨装饰印章 */
    .seal-decor {
      position: absolute;
      top: 18px;
      right: 22px;
      width: 52px;
      height: 52px;
      border: 2px solid #c0392b;
      color: #c0392b;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: bold;
      line-height: 1.1;
      opacity: 0.85;
      transform: rotate(6deg);
      pointer-events: none;
    }

    /* 关卡控制器 */
    .level-controller {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }
    .level-btn {
      background: #fdfaf5;
      border: 1px solid #dcd4c7;
      color: #5d6d7e;
      border-radius: 50%;
      width: 34px;
      height: 34px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      transition: all 0.2s;
    }
    .level-btn:hover:not(:disabled) {
      background: #2b5876;
      color: #fff;
      border-color: #2b5876;
    }
    .level-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    .level-indicator {
      font-size: 15px;
      font-weight: 700;
      color: #2c3e50;
      min-width: 90px;
      text-align: center;
    }

    /* 诗词信息头部 */
    .poem-meta {
      text-align: center;
      margin-bottom: 18px;
    }
    .poem-title {
      font-size: 32px;
      font-weight: 700;
      color: #1a252f;
      letter-spacing: 3px;
      margin-bottom: 4px;
    }
    .poem-author {
      font-size: 15px;
      color: #7f8c8d;
      letter-spacing: 1px;
    }

    /* 诗文展示与填字区 */
    .poem-lines-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      max-height: 52vh;
      overflow-y: auto;
      padding: 4px;
    }

    .poem-line {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 12px;
      transition: all 0.3s ease;
      background: transparent;
    }
    .poem-line.active {
      background: rgba(212, 175, 55, 0.12);
      box-shadow: 0 0 0 1.5px rgba(212, 175, 55, 0.4);
    }
    .poem-line.completed {
      background: rgba(46, 125, 50, 0.06);
    }

    /* 诗句中的单个字位槽 */
    .char-slot {
      width: 52px;
      height: 60px;
      border-radius: 10px;
      border: 2px dashed var(--slot-border);
      background: var(--slot-bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .char-slot .pinyin {
      font-size: 11px;
      color: #8c7b66;
      font-family: sans-serif;
      margin-top: -2px;
      opacity: 0.9;
    }

    .char-slot .char-text {
      font-size: 26px;
      font-weight: 700;
      color: transparent;
      line-height: 1;
    }

    /* 已完成填入字态 */
    .char-slot.filled {
      border: 2px solid #b38842;
      background: #fdfaf4;
      box-shadow: 0 4px 10px rgba(179, 136, 66, 0.15);
      animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .char-slot.filled .char-text {
      color: #2c3e50;
    }

    /* 预置显示的固定字（提示字） */
    .char-slot.preset {
      border: 1px solid #d5dbdb;
      background: #fafafa;
    }
    .char-slot.preset .char-text {
      color: #7f8c8d;
    }

    @keyframes popIn {
      0% { transform: scale(0.6); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* 提示与音效工具条 */
    .play-tools {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
    }

    .read-aloud-btn {
      background: linear-gradient(135deg, #2b5876, #4e4376);
      color: #fff;
      border: none;
      padding: 9px 20px;
      border-radius: 24px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 12px rgba(43, 88, 118, 0.25);
      transition: all 0.2s;
    }
    .read-aloud-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(43, 88, 118, 0.35);
    }

    /* 底部乱序选字区 */
    .char-picker-section {
      width: 100%;
      background: rgba(245, 241, 233, 0.9);
      border: 1px solid #e1d8ca;
      border-radius: 14px;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .picker-hint {
      font-size: 13px;
      color: #7f8c8d;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .char-options-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      min-height: 64px;
      align-items: center;
    }

    .char-option-tile {
      width: 54px;
      height: 60px;
      background: #ffffff;
      border: 2px solid #d0c5b4;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.06);
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .char-option-tile:hover {
      transform: translateY(-4px) scale(1.05);
      border-color: #b38842;
      box-shadow: 0 8px 16px rgba(179, 136, 66, 0.2);
    }

    .char-option-tile:active {
      transform: scale(0.95);
    }

    .char-option-tile.used {
      opacity: 0.2;
      pointer-events: none;
      transform: scale(0.85);
      border-style: dashed;
    }

    .char-option-tile .opt-pinyin {
      font-size: 11px;
      color: #95a5a6;
      font-family: sans-serif;
      margin-top: -2px;
    }

    .char-option-tile .opt-text {
      font-size: 26px;
      font-weight: 700;
      color: #2c3e50;
      line-height: 1;
    }

    /* 错选晃动反馈 */
    @keyframes shakeError {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
    .shake-anim {
      animation: shakeError 0.4s ease-in-out;
      border-color: #e74c3c !important;
    }

    /* 诗意释义卡片弹窗 */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-card {
      background: #fdfaf4;
      border: 2px solid #b38842;
      border-radius: 20px;
      padding: 28px 24px;
      max-width: 520px;
      width: 100%;
      text-align: center;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.25);
      position: relative;
      animation: popIn 0.3s ease-out;
    }

    .modal-stamp {
      font-size: 48px;
      margin-bottom: 8px;
    }

    .modal-title {
      font-size: 24px;
      font-weight: 700;
      color: #c0392b;
      margin-bottom: 12px;
    }

    .modal-meaning {
      font-size: 15px;
      line-height: 1.6;
      color: #4a5568;
      background: rgba(245, 237, 224, 0.7);
      padding: 14px 16px;
      border-radius: 12px;
      text-align: left;
      margin-bottom: 20px;
    }

    .modal-actions {
      display: flex;
      justify-content: center;
      gap: 14px;
    }

    .btn-next-poem {
      background: linear-gradient(135deg, #c0392b, #962d22);
      color: #fff;
      border: none;
      padding: 10px 26px;
      border-radius: 24px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(192, 57, 43, 0.3);
      transition: all 0.2s;
    }
    .btn-next-poem:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(192, 57, 43, 0.4);
    }

    /* 移动端适配 */
    @media (max-width: 640px) {
      .poem-title { font-size: 25px; }
      .char-slot { width: 40px; height: 48px; }
      .char-slot .char-text { font-size: 20px; }
      .char-slot .pinyin { font-size: 9px; }
      .char-option-tile { width: 44px; height: 50px; }
      .char-option-tile .opt-text { font-size: 21px; }
      .seal-decor { display: none; }
      .poem-stage { padding: 14px 10px; }
    }
  </style>

</head>
<body>

  <!-- 顶部状态导航 -->
  <header class="top-bar">

  <!-- 主舞台卡片 -->
  <main class="poem-stage">

    <div class="level-controller">

    <!-- 诗句槽位区 -->
    <div class="poem-lines-container" id="poemLinesContainer">

    <!-- 朗读与提示工具栏 -->

      <button class="read-aloud-btn" id="btnReadAloud">

  <!-- 诗意赏析与通关弹窗 -->

  <script>
    // Web Audio 音效系统 (完全免文件依赖)
    class SoundFX {
      constructor() {
        this.ctx = null;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      playNote(freq, type = 'sine', duration = 0.25, gain = 0.2) {
        this.init();
        try {
          const osc = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          g.gain.setValueAtTime(gain, this.ctx.currentTime);
          g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
          osc.connect(g);
          g.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch(e) {}
      }
      playCorrect() {
        this.playNote(523.25, 'triangle', 0.2, 0.2); // C5
        setTimeout(() => this.playNote(659.25, 'sine', 0.3, 0.25), 90); // E5
      }
      playLineDone() {
        // 编钟质感三音和弦
        [523.25, 659.25, 783.99, 1046.5].forEach((f, idx) => {
          setTimeout(() => this.playNote(f, 'sine', 0.45, 0.2), idx * 100);
        });
      }
      playWrong() {
        this.playNote(220, 'sawtooth', 0.25, 0.15);
      }
      playVictory() {
        const notes = [523.25, 659.25, 783.99, 1046.5];
        notes.forEach((f, i) => setTimeout(() => this.playNote(f, 'triangle', 0.5, 0.3), i * 140));
      }
    }

    const sfx = new SoundFX();

    // 精选小学生古诗文曲库 (共20首经典名篇)
    const POEMS_DATABASE = [
      {
        title: "咏鹅",
        author: "[唐] 骆宾王",
        isKindergarten: true,
        lines: [
          { text: "鹅鹅鹅", pinyin: "é é é" },
          { text: "曲项向天歌", pinyin: "qū xiàng xiàng tiān gē" },
          { text: "白毛浮绿水", pinyin: "bái máo fú lǜ shuǐ" },
          { text: "红掌拨清波", pinyin: "hóng zhǎng bō qīng bō" }
        ],
        meaning: "【诗意解说】大白鹅呀大白鹅，弯曲着美丽的脖颈朝天欢快鸣唱。洁白如雪的羽毛漂浮在碧绿清澈的水面上，红红的脚掌在水波中轻轻荡漾。"
      },
      {
        title: "静夜思",
        author: "[唐] 李白",
        isKindergarten: true,
        lines: [
          { text: "床前明月光", pinyin: "chuáng qián míng yuè guāng" },
          { text: "疑是地上霜", pinyin: "yí shì dì shàng shuāng" },
          { text: "举头望明月", pinyin: "jǔ tóu wàng míng yuè" },
          { text: "低头思故乡", pinyin: "dī tóu sī gù xiāng" }
        ],
        meaning: "【诗意解说】明亮皎洁的月光洒在床前，仿佛是地上凝结的一层白霜。诗人抬头仰望着夜空中的明月，不由得低下头深深思念起温馨的故乡。"
      },
      {
        title: "春晓",
        author: "[唐] 孟浩然",
        isKindergarten: true,
        lines: [
          { text: "春眠不觉晓", pinyin: "chūn mián bù jué xiǎo" },
          { text: "处处闻啼鸟", pinyin: "chù chù wén tí niǎo" },
          { text: "夜来风雨声", pinyin: "yè lái fēng yǔ shēng" },
          { text: "花落知多少", pinyin: "huā luò zhī duō shǎo" }
        ],
        meaning: "【诗意解说】春日里睡得香甜不知不觉天已大亮，到处都能听到清脆悦耳的鸟叫声。回想起昨夜刮风下雨的阵阵声音，不知娇嫩的花朵又飘落了多少呢。"
      },
      {
        title: "悯农",
        author: "[唐] 李绅",
        isKindergarten: true,
        lines: [
          { text: "锄禾日当午", pinyin: "chú hé rì dāng wǔ" },
          { text: "汗滴禾下土", pinyin: "hàn dī hé xià tǔ" },
          { text: "谁知盘中餐", pinyin: "shéi zhī pán zhōng cān" },
          { text: "粒粒皆辛苦", pinyin: "lì lì jiē xīn kǔ" }
        ],
        meaning: "【诗意解说】盛夏正午烈日炎炎，农民伯伯在田间辛勤锄草，汗水滴滴答答渗入禾苗下的泥土。又有谁知道我们餐盘里的每一口香甜米饭，粒粒都凝聚着艰辛的汗水！"
      },
      {
        title: "登鹳雀楼",

          { text: "报得三春晖", pinyin: "bào dé sān chūn huī" }
        ],
        meaning: "【诗意解说】慈祥的母亲手中紧握着针线，细细缝制着远行孩子身上的衣裳。有谁能够说像小草那样微弱的寸草之心，能够报答得了母亲春天太阳般博大深沉的恩情呢！"
      }
    ];

    class PoemGame {
      constructor() {
        this.currentMode = 'kindergarten'; // 默认进入最适合孩子的幼儿园启蒙模式
        this.playlist = [];
        this.currentPoemIndex = 0;
        this.currentLineIndex = 0;
        this.currentCharIndex = 0;
        this.showPinyin = true;

        this.initDOM();
        this.bindEvents();
        this.startRandomPlaylist(10);
      }

      initDOM() {
        this.poemTitleEl = document.getElementById('poemTitle');
        this.poemAuthorEl = document.getElementById('poemAuthor');
        this.linesContainerEl = document.getElementById('poemLinesContainer');
        this.optionsGridEl = document.getElementById('charOptionsGrid');
        this.levelIndicatorEl = document.getElementById('levelIndicator');
        this.btnPrevEl = document.getElementById('btnPrev');
        this.btnNextEl = document.getElementById('btnNext');
        this.btnReroll10 = document.getElementById('btnReroll10');
        this.btnFilterKinder = document.getElementById('btnFilterKinder');
        this.btnFilterAll = document.getElementById('btnFilterAll');
        this.btnTogglePinyin = document.getElementById('btnTogglePinyin');
        this.modalReward = document.getElementById('modalReward');
        this.modalMeaningText = document.getElementById('modalMeaningText');
        this.modalTitle = document.querySelector('.modal-title');
        this.btnModalNext = document.getElementById('btnModalNext');
      }

      bindEvents() {
        this.btnPrevEl.onclick = () => this.prevPoem();
        this.btnNextEl.onclick = () => this.nextPoem();
        
        if (this.btnFilterKinder) {
          this.btnFilterKinder.onclick = () => {
            this.currentMode = 'kindergarten';
            this.btnFilterKinder.classList.add('active');
            if (this.btnFilterAll) this.btnFilterAll.classList.remove('active');
            this.startRandomPlaylist(10);
          };
        }

        if (this.btnFilterAll) {
          this.btnFilterAll.onclick = () => {
            this.currentMode = 'all';
            this.btnFilterAll.classList.add('active');
            if (this.btnFilterKinder) this.btnFilterKinder.classList.remove('active');
            this.startRandomPlaylist(10);
          };
        }

        if (this.btnReroll10) {
          this.btnReroll10.onclick = () => {
            this.startRandomPlaylist(10);
          };
        }

        this.btnTogglePinyin.onclick = () => {
          this.showPinyin = !this.showPinyin;
          this.btnTogglePinyin.innerHTML = `<span>🔤</span> 拼音: ${this.showPinyin ? '开' : '关'}`;
          this.updatePinyinVisibility();
        };

        document.getElementById('btnReadAloud').onclick = () => {
          this.speakPoem();
        };

        document.getElementById('btnResetCurrent').onclick = () => {
          this.loadPoem(this.currentPoemIndex);
        };

        this.btnModalNext.onclick = () => {
          this.modalReward.style.display = 'none';
          if (this.currentPoemIndex >= this.playlist.length - 1) {
            this.startRandomPlaylist(10);
          } else {
            this.nextPoem();
          }
        };

        document.getElementById('btnListenReward').onclick = () => {
          this.speakPoem();
        };
      }

      // 每次根据当前模式随机抽取10首诗词 (Fisher-Yates 洗牌)
      startRandomPlaylist(count = 10) {
        const pool = (this.currentMode === 'kindergarten')
          ? POEMS_DATABASE.filter(p => p.isKindergarten)
          : POEMS_DATABASE;
        const shuffled = [...pool];
        for (let i = shuffled.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        this.playlist = shuffled.slice(0, Math.min(count, shuffled.length));
        this.loadPoem(0);
      }

      loadPoem(index) {
        if (index < 0 || index >= this.playlist.length) return;
        this.currentPoemIndex = index;
        this.currentLineIndex = 0;
        this.currentCharIndex = 0;

        const poem = this.playlist[index];
        this.poemTitleEl.textContent = poem.title;
        this.poemAuthorEl.textContent = poem.author;
        const modeLabel = (this.currentMode === 'kindergarten') ? ' [👶 幼小篇]' : ' [🌟 全题库]';
        this.levelIndicatorEl.textContent = `第 ${index + 1} / ${this.playlist.length} 首${modeLabel}`;

        this.btnPrevEl.disabled = index === 0;
        this.btnNextEl.disabled = index === this.playlist.length - 1;

        // 构建诗句槽位
        this.linesContainerEl.innerHTML = '';
        poem.lines.forEach((line, lineIdx) => {
          const lineEl = document.createElement('div');
          lineEl.className = 'poem-line' + (lineIdx === 0 ? ' active' : '');
          lineEl.dataset.lineIndex = lineIdx;

          const pinyinList = line.pinyin.split(' ');
          for (let c = 0; c < line.text.length; c++) {
            const char = line.text[c];
            const pinyin = pinyinList[c] || '';

            const slot = document.createElement('div');
            slot.className = 'char-slot';
            slot.dataset.char = char;
            slot.dataset.line = lineIdx;
            slot.dataset.charIdx = c;

            slot.innerHTML = `
              <span class="pinyin">${pinyin}</span>
              <span class="char-text">${char}</span>
            `;
            lineEl.appendChild(slot);
          }
          this.linesContainerEl.appendChild(lineEl);
        });

        this.updatePinyinVisibility();
        this.buildOptionsForCurrentLine();
      }

      updatePinyinVisibility() {
        const pinyins = document.querySelectorAll('.pinyin, .opt-pinyin');
        pinyins.forEach(el => {
          el.style.display = this.showPinyin ? 'block' : 'none';
        });
      }

      buildOptionsForCurrentLine() {
        const poem = this.playlist[this.currentPoemIndex];
        const currentLine = poem.lines[this.currentLineIndex];
        if (!currentLine) return;

        const chars = currentLine.text.split('');
        const pinyins = currentLine.pinyin.split(' ');

        // 打乱当前诗句所有字
        const items = chars.map((ch, idx) => ({ char: ch, pinyin: pinyins[idx] || '', originalIdx: idx }));
        
        // Fisher-Yates 洗牌算法打乱
        for (let i = items.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [items[i], items[j]] = [items[j], items[i]];
        }

        this.optionsGridEl.innerHTML = '';
        items.forEach(item => {
          const tile = document.createElement('div');
          tile.className = 'char-option-tile';
          tile.innerHTML = `
            <span class="opt-pinyin">${item.pinyin}</span>
            <span class="opt-text">${item.char}</span>
          `;
          tile.onclick = () => this.handleCharClick(tile, item.char);
          this.optionsGridEl.appendChild(tile);
        });

        this.updatePinyinVisibility();
      }

      handleCharClick(tileEl, clickedChar) {
        const poem = this.playlist[this.currentPoemIndex];
        const currentLine = poem.lines[this.currentLineIndex];
        const expectedChar = currentLine.text[this.currentCharIndex];

        if (clickedChar === expectedChar) {
          // 答对！
          sfx.playCorrect();
          tileEl.classList.add('used');

          // 点亮对应槽位
          const lineEl = this.linesContainerEl.children[this.currentLineIndex];
          const slot = lineEl.children[this.currentCharIndex];
          slot.classList.add('filled');

          this.currentCharIndex++;

          // 检查当前行是否拼完
          if (this.currentCharIndex >= currentLine.text.length) {
            lineEl.classList.remove('active');
            lineEl.classList.add('completed');
            sfx.playLineDone();

            // 原生发音朗读刚拼好的这句诗
            this.speakText(currentLine.text);

            this.currentLineIndex++;
            this.currentCharIndex = 0;

            // 检查整首诗是否完成
            if (this.currentLineIndex >= poem.lines.length) {
              setTimeout(() => this.handlePoemCompleted(), 500);
            } else {
              // 进行下一行
              const nextLineEl = this.linesContainerEl.children[this.currentLineIndex];
              if (nextLineEl) nextLineEl.classList.add('active');
              setTimeout(() => this.buildOptionsForCurrentLine(), 300);
            }
          }
        } else {
          // 答错反馈
          sfx.playWrong();
          tileEl.classList.add('shake-anim');
          setTimeout(() => tileEl.classList.remove('shake-anim'), 400);
        }
      }

      handlePoemCompleted() {
        sfx.playVictory();
        const poem = this.playlist[this.currentPoemIndex];
        this.modalMeaningText.textContent = poem.meaning;

        const isLastOfRound = (this.currentPoemIndex >= this.playlist.length - 1);
        if (isLastOfRound) {
          if (this.modalTitle) this.modalTitle.textContent = "🎉 挑战成功！10首古诗全部通关！";
          if (this.btnModalNext) this.btnModalNext.textContent = "再来一组随机10首 🎲";
        } else {
          if (this.modalTitle) this.modalTitle.textContent = "诗仙点赞 · 成功通关！";
          if (this.btnModalNext) this.btnModalNext.textContent = "挑战下一首 🚀";
        }

        this.modalReward.style.display = 'flex';
      }

      prevPoem() {
        if (this.currentPoemIndex > 0) {
          this.loadPoem(this.currentPoemIndex - 1);
        }
      }

      nextPoem() {
        if (this.currentPoemIndex < this.playlist.length - 1) {
          this.loadPoem(this.currentPoemIndex + 1);
        } else {
          this.startRandomPlaylist(10);
        }
      }

      speakText(text) {
        if (!('speechSynthesis' in window)) return;
        try {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = 'zh-CN';
          utterance.rate = 0.85; // 稍微放慢语速，适合孩子跟读
          window.speechSynthesis.speak(utterance);
        } catch(e) {}
      }

      speakPoem() {
        const poem = this.playlist[this.currentPoemIndex];
        const fullText = `${poem.title}。${poem.author}。` + poem.lines.map(l => l.text).join('，') + '。';
        this.speakText(fullText);
      }
    }

    // 初始化游戏
    window.addEventListener('DOMContentLoaded', () => {
      new PoemGame();
    });
  </script>
</body>
