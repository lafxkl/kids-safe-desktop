<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>五子棋</title>
<style>
  * { -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #F3E7D3;
    font-family: "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
  }
  #app {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    background: linear-gradient(180deg, #FBF3E4 0%, #EFDFC5 100%);
  }

  header {
    flex: none; display: flex; align-items: center; gap: 6px;
    padding: 6px 10px; padding-top: calc(6px + env(safe-area-inset-top));
    background: #6D4C33;
  }
  .turn {
    display: inline-flex; align-items: center; gap: 6px;
    color: #FFF3DC; font-size: 13px; font-weight: 700; white-space: nowrap;
  }
  .turn i {
    width: 13px; height: 13px; border-radius: 50%; display: inline-block;
    background: radial-gradient(circle at 35% 32%, #6B6F6E, #0A0A0A 70%);
    box-shadow: 0 0 0 2px rgba(255,255,255,.25);
  }
  .turn i.white { background: radial-gradient(circle at 35% 32%, #FFFFFF, #C9C9C9 75%); }
  .spacer { flex: 1; }
  button {
    font: inherit; font-weight: 700; font-size: 13px; color: #4A3218;
    background: #F4E3BE; border: none; border-radius: 10px;
    padding: 7px 11px; min-height: 32px; white-space: nowrap;
    box-shadow: 0 2px 0 #A9885A;
  }
  button:active { transform: translateY(1px); box-shadow: 0 1px 0 #A9885A; }

  #stage {
    flex: 1; position: relative; min-height: 0;
    display: flex; align-items: center; justify-content: center;
  }
  canvas { display: block; border-radius: 10px; box-shadow: 0 6px 18px rgba(90,60,30,.28); touch-action: none; }

  footer {
    flex: none; display: flex; align-items: center; gap: 10px;
    padding: 6px 12px calc(6px + env(safe-area-inset-bottom)) 12px;
  }
  footer .hint { font-size: 11.5px; color: #8A7355; line-height: 1.4; }

  #over {
    position: absolute; inset: 0; z-index: 6;
    display: flex; align-items: center; justify-content: center;
    background: rgba(60,40,22,.45); border-radius: 10px;
  }
  #over.hidden { display: none; }
  .panel {
    background: #FFF8E9; border-radius: 18px; padding: 20px 26px; text-align: center;
    box-shadow: inset 0 0 0 3px #E0C79B, 0 14px 30px rgba(0,0,0,.28);
  }
  .panel h2 { margin: 0 0 4px; font-size: 22px; color: #5A3E20; }
  .panel p { margin: 0 0 14px; font-size: 13px; color: #93795A; }
  .panel button { padding: 11px 24px; font-size: 15px; background: #C8A165; color: #fff; box-shadow: 0 3px 0 #9A7640; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="turn"><i id="turnDot"></i><span id="turnTxt">你先走</span></div>
    <div class="spacer"></div>
    <button id="btnMode">人机</button>
    <button id="btnLevel">普通</button>
    <button id="btnReset">重开</button>
  </header>

  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="over" class="hidden">
      <div class="panel">
        <h2 id="overTitle">你赢了</h2>
        <p id="overSub">连成五子</p>
        <button id="btnAgain">再来一局</button>
      </div>
    </div>
  </div>

  <footer>
    <button id="btnUndo">悔棋</button>
    <span class="hint">点交叉点落子，先连成五子者胜</span>
  </footer>
</div>

<script>
(function () {
  'use strict';

  /*
   * 五子棋。赢法数组与 AI 打分权重来自 Gomoku-master（js/main.js）：
   * 它的核心是「先把所有可能的五连枚举成 572 个编号」，落子时只要给
   * 经过这点的若干编号计数，判断胜负和打分都是查表，不用每次扫全盘。
   * 这一版改了四件事：画布自适应屏幕、alert 换成页面内结算、
   * 加了悔棋（从棋谱重算计数）、加了难度。
   */

  var N = 15;
  var EMPTY = 0, BLACK = 1, WHITE = 2;   // 黑=玩家先手，白=电脑

  var board = [];
  var wins = [];          // wins[i][j] = { k: true, ... } 该点属于哪几种五连
  var count = 0;          // 五连总数 572
  var myWin = [];         // 玩家在第 k 种五连里的子数
  var cpWin = [];         // 电脑在第 k 种五连里的子数
  var history = [];       // 棋谱 [{i,j,side}]
  var turn = BLACK;
  var over = false;
  var winLine = null;
  var mode = 'pve';       // pve 人机 / pvp 双人
  var level = 2;          // 1 简单 / 2 普通 / 3 困难
  var aiBusy = false;

  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var stage = document.getElementById('stage');
  var elDot = document.getElementById('turnDot');
  var elTurn = document.getElementById('turnTxt');
  var elOver = document.getElementById('over');

  var dpr = 1, size = 0, pad = 0, step = 0, stoneR = 0;

  // ────────── 赢法枚举（与 Gomoku-master 一致） ──────────
  function buildWins() {
    wins = [];
    for (var i = 0; i < N; i++) {
      wins[i] = [];
      for (var j = 0; j < N; j++) wins[i][j] = [];
    }
    count = 0;
    // 竖
    for (i = 0; i < N; i++) {
      for (j = 0; j < N - 4; j++) {
        for (var k = 0; k < 5; k++) wins[i][j + k][count] = true;
        count++;
      }
    }
    // 横
    for (i = 0; i < N; i++) {
      for (j = 0; j < N - 4; j++) {
        for (k = 0; k < 5; k++) wins[j + k][i][count] = true;
        count++;
      }
    }
    // 斜
    for (i = 0; i < N - 4; i++) {
      for (j = 0; j < N - 4; j++) {
        for (k = 0; k < 5; k++) wins[i + k][j + k][count] = true;
        count++;
      }
    }
    // 反斜
    for (i = 0; i < N - 4; i++) {
      for (j = N - 1; j > 3; j--) {
        for (k = 0; k < 5; k++) wins[i + k][j - k][count] = true;
        count++;
      }
    }
  }

  /*
   * 从棋谱重算每种五连里的黑白子数。
   * 原工程是落子时增量 +1，悔棋时没法撤销；这里改成整盘重算，
   * 一次 225×572 的查表，毫秒级，换来做悔棋不用自己记账。
   * 同一条五连里黑白都有 → 双方都记 6（死线），永远不会凑成五。
   */
  function recount() {
    myWin = new Array(count);
    cpWin = new Array(count);
    for (var k = 0; k < count; k++) { myWin[k] = 0; cpWin[k] = 0; }
    for (var i = 0; i < N; i++) {
      for (var j = 0; j < N; j++) {
        var s = board[i][j];
        if (!s) continue;
        var ks = wins[i][j];
        for (var kk in ks) {
          if (s === BLACK) myWin[kk]++;
          else cpWin[kk]++;
        }
      }
    }
    for (k = 0; k < count; k++) {
      if (myWin[k] > 0 && cpWin[k] > 0) { myWin[k] = 6; cpWin[k] = 6; }
    }
  }

  // ────────── 胜负 ──────────
  var DIRS = [[1, 0], [0, 1], [1, 1], [1, -1]];

  /** 以 (i,j) 落子后是否连成五子；返回那五个点的坐标（用于高亮）。 */
  function lineOf(i, j, side) {
    for (var d = 0; d < 4; d++) {
      var dx = DIRS[d][0], dy = DIRS[d][1];
      var cells = [[i, j]];
      var x, y, n;
      for (n = 1; n < 5; n++) {
        x = i + dx * n; y = j + dy * n;
        if (x < 0 || x >= N || y < 0 || y >= N || board[x][y] !== side) break;
        cells.push([x, y]);
      }
      for (n = 1; n < 5; n++) {
        x = i - dx * n; y = j - dy * n;
        if (x < 0 || x >= N || y < 0 || y >= N || board[x][y] !== side) break;
        cells.unshift([x, y]);
      }
      if (cells.length >= 5) return cells;
    }
    return null;
  }

  // ────────── 落子 ──────────
  function doPlace(i, j, side) {
    board[i][j] = side;
    history.push({ i: i, j: j, side: side });
    recount();
    var line = lineOf(i, j, side);
    if (line) { winLine = line; over = true; }
    else if (history.length >= N * N) { over = true; winLine = null; }
    draw();
    return line;
  }

  function humanPlace(i, j) {
    if (over || aiBusy) return false;
    if (i < 0 || i >= N || j < 0 || j >= N) return false;
    if (board[i][j] !== EMPTY) return false;

    var line = doPlace(i, j, turn);
    sfx('sel');
    if (line) { finish(turn === BLACK ? 'win' : 'lose'); return true; }

    turn = (turn === BLACK ? WHITE : BLACK);
    updateHud();

    if (mode === 'pve' && turn === WHITE && !over) aiTurn();
    return true;
  }

  function aiTurn() {
    aiBusy = true;
    updateHud();
    setTimeout(function () {
      if (over) { aiBusy = false; return; }
      var mv = aiPick();
      if (!mv) { aiBusy = false; over = true; draw(); updateHud(); return; }
      var line = doPlace(mv.i, mv.j, WHITE);
      sfx('go');
      aiBusy = false;
      if (line) { finish('lose'); return; }
      if (history.length >= N * N) { over = true; draw(); updateHud(); return; }
      turn = BLACK;
      updateHud();
      draw();
    }, 260);
  }

  function finish(result) {
    over = true;
    aiBusy = false;
    document.getElementById('overTitle').textContent =
      result === 'win' ? '你赢了！' : result === 'lose' ? (mode === 'pve' ? '电脑赢了' : '白棋赢了') : '平局';
    document.getElementById('overSub').textContent =
      result === 'win' ? '连成五子，厉害' : result === 'lose' ? '再来一局，堵住它的四连' : '棋盘下满了';
    elOver.classList.remove('hidden');
    draw();
    updateHud();
    sfx(result === 'win' ? 'win' : 'lose');
    try {
      if (window.KidsSafe && window.KidsSafe.award) {
        var key = 'ksgomoku.wins';
        var wins = parseInt(localStorage.getItem(key) || '0', 10) || 0;
        if (result === 'win') { wins++; localStorage.setItem(key, String(wins)); }
        window.KidsSafe.award('gomoku', result === 'win' ? 4 : 1, wins,
          (mode === 'pve' ? '人机' : '双人') + ' · ' + (result === 'win' ? '胜' : (result === 'lose' ? '负' : '平')) +
          ' ' + wins + ' 局');
      }
    } catch (e) {}
  }

  // ────────── AI ──────────
  // 权重直接沿用 Gomoku-master：自己的四连(20000) 比堵对方的四连(10000) 更值钱。
  var W_HUMAN = { 1: 200, 2: 400, 3: 2000, 4: 10000 };
  var W_AI = { 1: 220, 2: 420, 3: 2100, 4: 20000 };

  function nearStone(i, j, r) {
    for (var x = Math.max(0, i - r); x <= Math.min(N - 1, i + r); x++) {
      for (var y = Math.max(0, j - r); y <= Math.min(N - 1, j + r); y++) {
        if (board[x][y] !== EMPTY) return true;
      }
    }
    return false;
  }

  function aiPick() {
    var cand = [];
    var radius = level >= 3 ? 2 : 2;
    for (var i = 0; i < N; i++) {
      for (var j = 0; j < N; j++) {
        if (board[i][j] !== EMPTY) continue;
        if (history.length > 0 && !nearStone(i, j, radius)) continue;
        cand.push([i, j]);
      }
    }
    if (!cand.length) {
      for (i = 0; i < N; i++) for (j = 0; j < N; j++) if (board[i][j] === EMPTY) cand.push([i, j]);
    }
    if (!cand.length) return null;

    // 简单档：防守打折 + 有概率随便下，给小孩留活路
    var defWeight = level === 1 ? 0.45 : level === 2 ? 1.0 : 1.15;
    var scored = [];
    for (var c = 0; c < cand.length; c++) {
      var ci = cand[c][0], cj = cand[c][1];
      var atk = 0, def = 0;
      var ks = wins[ci][cj];
      for (var k in ks) {
        atk += W_AI[cpWin[k]] || 0;
        def += W_HUMAN[myWin[k]] || 0;
      }
      // 越靠中间越优先：同分时先占中路
      var center = 7 - Math.max(Math.abs(ci - 7), Math.abs(cj - 7));
      var s = atk + def * defWeight + center * 3;
      scored.push({ i: ci, j: cj, s: s, atk: atk, def: def });
    }
    scored.sort(function (a, b) { return b.s - a.s || b.atk - a.atk; });

    if (level === 1) {
      // 前四名里随机挑一个，免得每局开头都一样
      var top = scored.slice(0, Math.min(4, scored.length));
      var pick = top[Math.floor(Math.random() * top.length)];
      return { i: pick.i, j: pick.j };
    }
    return { i: scored[0].i, j: scored[0].j };
  }

  // ────────── 绘制 ──────────
  function layout() {
    var w = stage.clientWidth, h = stage.clientHeight;
    var s = Math.min(w, h) - 10;
    if (s <= 0) return;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    size = Math.floor(s);
    cv.style.width = size + 'px';
    cv.style.height = size + 'px';
    cv.width = Math.floor(size * dpr);
    cv.height = Math.floor(size * dpr);
    pad = Math.max(10, size * 0.05);
    step = (size - pad * 2) / (N - 1);
    stoneR = step * 0.45;
    draw();
  }

  function pt(i, j) { return [pad + i * step, pad + j * step]; }

  function draw() {
    if (!size) return;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, size, size);

    // 木纹底
    var g = ctx.createLinearGradient(0, 0, size, size);
    g.addColorStop(0, '#F0D3A2');
    g.addColorStop(0.5, '#E8C48C');
    g.addColorStop(1, '#DCB278');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, size, size);
    // 一点点纹理，别太花
    ctx.strokeStyle = 'rgba(150,105,60,.10)';
    ctx.lineWidth = 1;
    for (var t = 0; t < 9; t++) {
      var yy = (t + 0.5) * size / 9;
      ctx.beginPath();
      ctx.moveTo(0, yy);
      ctx.bezierCurveTo(size * 0.3, yy - 5, size * 0.6, yy + 6, size, yy - 2);
      ctx.stroke();
    }

    // 格线
    ctx.strokeStyle = '#8A5B32';
    ctx.lineWidth = Math.max(1, step * 0.028);
    for (var i = 0; i < N; i++) {
      ctx.beginPath();
      ctx.moveTo(pad, pad + i * step);
      ctx.lineTo(pad + (N - 1) * step, pad + i * step);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(pad + i * step, pad);
      ctx.lineTo(pad + i * step, pad + (N - 1) * step);
      ctx.stroke();
    }
    // 外框
    ctx.lineWidth = Math.max(1.5, step * 0.05);
    ctx.strokeRect(pad, pad, (N - 1) * step, (N - 1) * step);

    // 星位
    ctx.fillStyle = '#7A4E29';
    [[3, 3], [11, 3], [3, 11], [11, 11], [7, 7]].forEach(function (p) {
      ctx.beginPath();
      ctx.arc(pad + p[0] * step, pad + p[1] * step, Math.max(1.6, step * 0.09), 0, Math.PI * 2);
      ctx.fill();
    });

    // 棋子
    for (i = 0; i < N; i++) {
      for (var j = 0; j < N; j++) {
        var s = board[i][j];
        if (!s) continue;
        drawStone(i, j, s);
      }
    }

    // 最后一手的标记
    if (history.length && !winLine) {
      var last = history[history.length - 1];
      var p = pt(last.i, last.j);
      ctx.strokeStyle = last.side === BLACK ? 'rgba(255,255,255,.85)' : 'rgba(40,30,20,.7)';
      ctx.lineWidth = Math.max(1.5, step * 0.06);
      ctx.beginPath();
      ctx.arc(p[0], p[1], stoneR * 0.42, 0, Math.PI * 2);
      ctx.stroke();
    }

    // 五连高亮
    if (winLine) {
      var a = pt(winLine[0][0], winLine[0][1]);
      var b = pt(winLine[winLine.length - 1][0], winLine[winLine.length - 1][1]);
      ctx.strokeStyle = 'rgba(226,60,50,.9)';
      ctx.lineWidth = Math.max(3, step * 0.12);
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(a[0], a[1]);
      ctx.lineTo(b[0], b[1]);
      ctx.stroke();
    }
  }

  function drawStone(i, j, side) {
    var p = pt(i, j);
    ctx.save();
    ctx.beginPath();
    ctx.arc(p[0] + 1.5, p[1] + 2.5, stoneR, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(90,60,30,.28)';
    ctx.fill();

    var rg = ctx.createRadialGradient(
      p[0] - stoneR * 0.35, p[1] - stoneR * 0.4, stoneR * 0.1,
      p[0], p[1], stoneR
    );
    if (side === BLACK) {
      rg.addColorStop(0, '#6E7371');
      rg.addColorStop(0.35, '#2A2C2B');
      rg.addColorStop(1, '#0A0A0A');
    } else {
      rg.addColorStop(0, '#FFFFFF');
      rg.addColorStop(0.55, '#F2F2F2');
      rg.addColorStop(1, '#C4C4C4');
    }
    ctx.beginPath();
    ctx.arc(p[0], p[1], stoneR, 0, Math.PI * 2);
    ctx.fillStyle = rg;
    ctx.fill();
    ctx.restore();
  }

  // ────────── 界面 ──────────
  function updateHud() {
    var blackTurn = turn === BLACK;
    elDot.className = blackTurn ? '' : 'white';
    if (over) elTurn.textContent = '本局结束';
    else if (mode === 'pvp') elTurn.textContent = blackTurn ? '黑棋' : '白棋';
    else elTurn.textContent = blackTurn ? '轮到你' : (aiBusy ? '电脑想想…' : '电脑');
  }

  function newGame() {
    board = [];
    for (var i = 0; i < N; i++) {
      board[i] = [];
      for (var j = 0; j < N; j++) board[i][j] = EMPTY;
    }
    history = [];
    turn = BLACK;
    over = false;
    winLine = null;
    aiBusy = false;
    elOver.classList.add('hidden');
    recount();
    updateHud();
    draw();
  }

  function undo() {
    if (over || aiBusy || !history.length) return;
    var n = (mode === 'pve' && history.length >= 2) ? 2 : 1;
    for (var i = 0; i < n; i++) {
      var m = history.pop();
      if (m) board[m.i][m.j] = EMPTY;
    }
    turn = BLACK;
    winLine = null;
    over = false;
    elOver.classList.add('hidden');
    recount();
    updateHud();
    draw();
    sfx('sel');
  }

  function cycleMode() {
    mode = mode === 'pve' ? 'pvp' : 'pve';
    document.getElementById('btnMode').textContent = mode === 'pve' ? '人机' : '双人';
    document.getElementById('btnLevel').style.display = mode === 'pve' ? '' : 'none';
    newGame();
  }

  function cycleLevel() {
    level = level % 3 + 1;
    document.getElementById('btnLevel').textContent = ['', '简单', '普通', '困难'][level];
    newGame();
  }

  // ────────── 音效（复用象棋工程的木质感音效） ──────────
  var snd = {};
  function sfx(name) {
    try {
      if (!snd[name]) {
        var map = { sel: 'snd/select.mp3', go: 'snd/go.mp3', win: 'snd/gamewin.mp3', lose: 'snd/gamelose.mp3' };
        snd[name] = new Audio(map[name]);
      }
      snd[name].currentTime = 0;
      var pr = snd[name].play();
      if (pr && pr.catch) pr.catch(function () {});
    } catch (e) { /* 没有音频权限就算了 */ }
  }

  // ────────── 输入 ──────────
  cv.addEventListener('pointerdown', function (ev) {
    ev.preventDefault();
    if (mode === 'pvp' && turn === WHITE) { /* 双人模式两人都能下 */ }
    var rc = cv.getBoundingClientRect();
    var x = ev.clientX - rc.left, y = ev.clientY - rc.top;
    var i = Math.round((x - pad) / step);
    var j = Math.round((y - pad) / step);
    if (i < 0 || i >= N || j < 0 || j >= N) return;
    // 离交叉点太远就忽略（约一个格子内才认）
    var p = pt(i, j);
    if (Math.abs(p[0] - x) > step * 0.52 || Math.abs(p[1] - y) > step * 0.52) return;

    if (mode === 'pve' && turn === WHITE) return;   // 人机模式等电脑
    humanPlace(i, j);
  }, { passive: false });

  document.getElementById('btnMode').onclick = cycleMode;
  document.getElementById('btnLevel').onclick = cycleLevel;
  document.getElementById('btnReset').onclick = newGame;
  document.getElementById('btnAgain').onclick = newGame;
  document.getElementById('btnUndo').onclick = undo;

  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', function () { setTimeout(layout, 120); });
  if (window.ResizeObserver) new ResizeObserver(function () { layout(); }).observe(stage);

  // ────────── 测试钩子 ──────────
  window.__gmk = {
    board: function () { return board; },
    state: function () {
      return { turn: turn, over: over, mode: mode, level: level, moves: history.length, winLine: winLine };
    },
    place: humanPlace,
    aiPick: aiPick,
    aiMove: function () {
      var m = aiPick();
      if (m) doPlace(m.i, m.j, WHITE);
      return m;
    },
    put: function (i, j, side) { doPlace(i, j, side); },
    lineOf: lineOf,
    reset: newGame,
    undo: undo,
    setMode: function (m) { mode = m; },
    setLevel: function (l) { level = l; },
    winCount: function () { return count; },
    layout: layout
  };

  buildWins();
  newGame();
  layout();
  setTimeout(layout, 60);
})();
</script>
