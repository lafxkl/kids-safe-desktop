<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>记住它</title>
<style>
  /*
   * 记住它 —— 移植自 Cocos2d-x 工程 kidrememberit（C++，2015）。
   *
   * 原版两个阶段：先看几张牌，牌飞走，再从下方牌堆里按顺序把牌放回原位。
   * 移植时按它自己 README 里「版本 1 测试结果」的四条反思做了改动：
   *   1. 女儿玩了不到 5 分钟就没兴趣 → 加了开场教程（3 步，首次自动弹），
   *      倒计时改成大号秒数 + 会变红的进度条，不再只是顶上一条细线；
   *   2. 「增加种类会极大提高难度」→ 起步只有 2 种牌，种类永远 ≤ 张数/2；
   *   3. 只有一种玩法太单调 → 每第 3 关是翻牌配对（README 里的 Step 2），
   *      两种玩法交替出现；
   *   4. 「用 0-9 或 A-Z 比动物简单」→ 牌面改成 1-9 数字 + 固定配色，
   *      不再用原版那套动物图集（顺带省掉 177KB 图集和 plist 解析）。
   *
   * 保留的是原版真正值钱的部分：难度因子、时间因子公式、升降级规则。
   * 这些是 2015 年那版代码里唯一经过推敲的东西，见 UserData.cpp / Puzzle.cpp。
   */
  :root{
    --cream:#FFF7EF; --ink:#4A3B32; --muted:#9B8574; --line:#EFE3D6;
    --violet:#7C5CE0; --orange:#F0862F; --teal:#2AA7A0; --red:#E5533D;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; height:100%; overflow:hidden; background:var(--cream);
    font-family:-apple-system,"HarmonyOS Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--ink); user-select:none; -webkit-user-select:none;
  }
  #app{
    position:fixed; inset:0; display:flex; flex-direction:column; gap:8px;
    padding:10px 12px 12px;
    background:
      radial-gradient(circle at 10% 6%, #FFE9CE 0%, rgba(255,233,206,0) 44%),
      radial-gradient(circle at 92% 94%, #E7E0FB 0%, rgba(231,224,251,0) 46%),
      var(--cream);
  }

  /* ── 顶栏：关卡 / 难度 / 计时 ── */
  .top{ flex:none; display:flex; align-items:center; gap:8px; }
  .chip{
    font-size:12px; padding:5px 10px; border-radius:11px;
    background:#FFFFFF; color:#8A7A6B; box-shadow:0 2px 0 #EADFD2; white-space:nowrap;
  }
  .chip b{ color:var(--violet); font-size:13px; }
  .spacer{ flex:1; }
  .best{ font-size:11px; color:var(--muted); text-align:right; line-height:1.3; }
  .best b{ color:var(--ink); }

  /* 计时：条 + 大号秒数。原版只有一条 3px 的进度条，孩子根本注意不到 */
  .timer{ flex:none; display:flex; align-items:center; gap:8px; }
  .bar{
    flex:1; height:12px; border-radius:7px; overflow:hidden;
    background:#F1E7DA; box-shadow:inset 0 1px 2px rgba(120,90,60,.16);
  }
  .bar i{
    display:block; height:100%; width:100%; border-radius:7px;
    background:linear-gradient(90deg,#7BD3B8,#2AA7A0);
    transition:width .12s linear;
  }
  .bar.warn i{ background:linear-gradient(90deg,#FFC46B,#F0862F); }
  .bar.hot i{ background:linear-gradient(90deg,#FF8A7A,#E5533D); }
  .sec{
    font-size:15px; font-weight:800; color:var(--teal); min-width:52px; text-align:right;
    font-variant-numeric:tabular-nums;
  }
  .sec.warn{ color:var(--orange); }
  .sec.hot{ color:var(--red); animation:pulse .8s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.14); } }

  /* ── 牌桌 ── */
  .board{
    flex:1; min-height:0; display:grid; gap:8px; align-content:center; justify-content:center;
    grid-template-columns:repeat(4,minmax(0,1fr));
  }
  .slot{
    position:relative; border-radius:14px; background:#FFFFFF;
    box-shadow:inset 0 0 0 2px #F1E7DA, 0 2px 0 #EADFD2;
    display:flex; align-items:center; justify-content:center;
    aspect-ratio:1/1; min-width:0; min-height:0;
  }
  .slot .no{
    font-size:12px; font-weight:700; color:#D8C9B8;
    position:absolute; left:7px; top:5px;
  }
  .slot.next{ box-shadow:inset 0 0 0 3px var(--violet), 0 0 0 4px rgba(124,92,224,.14); }
  .slot small{
    font-size:10px; color:#C9B9A7; text-align:center; line-height:1.3; padding:0 4px;
  }

  /* ── 卡牌 ── */
  .card{
    width:100%; height:100%; border-radius:13px;
    display:flex; align-items:center; justify-content:center;
    font-weight:800; color:#fff; letter-spacing:-1px;
    box-shadow:0 3px 0 rgba(0,0,0,.14), inset 0 -3px 0 rgba(0,0,0,.08);
    position:relative;
    transition:transform .16s ease, opacity .2s ease;
  }
  /*
   * 不给 .card 加 overflow:hidden —— 24 点那页在 ArkWeb 上踩过：
   * 圆角 + 裁剪的组合会让卡片里的文字整块不绘制（截图里牌是空白的）。
   * 这里没有需要裁的内容，圆角交给 border-radius 自己画。
   */
  .card .n{ font-size:clamp(18px,7vmin,44px); line-height:1; }
  .card .dot{
    position:absolute; right:7px; bottom:6px; width:5px; height:5px;
    border-radius:50%; background:rgba(255,255,255,.75);
  }
  .card.back{
    background:
      repeating-linear-gradient(45deg,#C9B8F5 0 6px,#BEAAEF 6px 12px);
    box-shadow:inset 0 0 0 3px #FFFFFF, 0 3px 0 #9F8BD8;
  }
  .card.back .n{ font-size:16px; color:#FFFFFF; opacity:.9; }
  .card.picked{ transform:translateY(-6px) scale(1.04); }
  .card.gone{ opacity:0; transform:scale(.7); }
  .card.wrong{ animation:shake .34s; }
  @keyframes shake{
    0%,100%{ transform:translateX(0); } 20%{ transform:translateX(-7px) rotate(-2deg); }
    55%{ transform:translateX(7px) rotate(2deg); } 80%{ transform:translateX(-3px); }
  }

  /* ── 牌堆（还原阶段） ── */
  .pool{
    flex:none; min-height:74px; display:flex; flex-wrap:wrap; gap:7px;
    align-content:center; justify-content:center;
    padding:8px 6px; border-radius:16px; background:#FFFFFF;
    box-shadow:0 2px 0 #EADFD2;
  }
  .pool.hide{ display:none; }
  .pool .card{ width:52px; height:52px; }
  .pool .card .n{ font-size:22px; }
  .pool .card:active{ transform:translateY(2px); }

  /* ── 遮罩层：教程 / 结算 / 菜单 ── */
  .veil{
    position:absolute; inset:0; z-index:20; display:flex; align-items:center; justify-content:center;
    padding:18px; background:rgba(58,40,26,.42); backdrop-filter:blur(2px);
  }
  .veil.hide{ display:none; }
  .sheet{
    width:min(420px,100%); max-height:100%; overflow:auto;
    background:#FFFCF6; border-radius:20px; padding:18px 18px 16px;
    box-shadow:0 16px 34px rgba(70,45,20,.3), inset 0 0 0 2px #F0E4D4;
    text-align:center;
  }
  .sheet h2{ margin:0 0 6px; font-size:19px; color:#4A3B32; }
  .sheet p{ margin:0 0 12px; font-size:13px; color:#8A7767; line-height:1.6; }
  .sheet .big{ font-size:34px; line-height:1.1; margin:2px 0 8px; }
  .btn{
    font:inherit; font-weight:700; font-size:15px; color:#fff; border:none;
    border-radius:13px; padding:12px 22px; background:var(--violet);
    box-shadow:0 3px 0 #5C3FBF; min-height:44px;
  }
  .btn:active{ transform:translateY(2px); box-shadow:0 1px 0 #5C3FBF; }
  .btn.ghost{ background:#FFFFFF; color:#7A6555; box-shadow:0 3px 0 #E6D9C9; }
  .btn.warm{ background:var(--orange); box-shadow:0 3px 0 #C4661A; }
  .row{ display:flex; gap:9px; justify-content:center; flex-wrap:wrap; margin-top:12px; }

  /* 教程三步 */
  .tut{ text-align:left; }
  .tut .step{
    display:flex; gap:10px; align-items:flex-start; margin:0 0 10px;
    font-size:13px; line-height:1.55; color:#6E5C4C;
  }
  .tut .step i{
    flex:none; width:22px; height:22px; border-radius:11px; background:#F1E9FF;
    color:var(--violet); font-style:normal; font-weight:800; font-size:12px;
    display:flex; align-items:center; justify-content:center; margin-top:1px;
  }
  .tut .step b{ color:#4A3B32; }
  .dots{ display:flex; gap:5px; justify-content:center; margin:2px 0 12px; }
  .dots u{ width:6px; height:6px; border-radius:3px; background:#E2D4C3; }
  .dots u.on{ width:16px; background:var(--violet); }

  /* 结算里的星星 */
  .stars{ display:flex; gap:6px; justify-content:center; margin:4px 0 10px; font-size:30px; }
  .stars span{ filter:grayscale(1); opacity:.35; }
  .stars span.on{ filter:none; opacity:1; animation:pop .3s ease; }
  @keyframes pop{ 0%{ transform:scale(.4); } 70%{ transform:scale(1.15); } 100%{ transform:scale(1); } }

  .tip{ flex:none; font-size:11px; color:#A99784; text-align:center; min-height:15px; }
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div class="chip" id="chipLevel">第 <b>1</b> 关</div>
    <div class="chip" id="chipDiff">5 张 · 2 种</div>
    <div class="spacer"></div>
    <div class="best" id="best">最佳 <b>1</b> 关<br><span id="bestSub">还没玩过</span></div>
  </div>

  <div class="timer">
    <div class="bar" id="bar"><i id="barFill"></i></div>
    <div class="sec" id="sec">--</div>
  </div>

  <div class="board" id="board"></div>
  <div class="pool hide" id="pool"></div>
  <div class="tip" id="tip">记住牌面，再按顺序摆回去</div>

  <div class="veil" id="veil">
    <div class="sheet" id="sheet"></div>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* =========================================================
   * 一、难度模型（照抄 UserData.cpp / Puzzle.cpp，改了初值）
   * ========================================================= */
  var MIN_NUM = 5, MAX_NUM = 14;
  var MIN_TYPES = 2, MAX_TYPES = 9;
  var TYPE_COUNT = 9;              // 牌面 1..9

  // 原版 addScore 每 8 分把时间因子清零（相当于「这 8 分是白送的，时间重新放开」）。
  // 这里改成按「一关」结算：连对就收紧，错一次就放宽，逻辑更好懂。
  var SAVE_KEY = 'kidsafe.memory.v1';

  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

  /** 类型数必须 ≥ 张数/3，且 ≤ 张数/2；两个约束冲突时张数/2 优先（否则 5 张 2 种会被算成 3 种）。 */
  function fixTypes(numbers, types) {
    types = clamp(types, MIN_TYPES, MAX_TYPES);
    types = Math.max(types, Math.ceil(numbers / 3));
    types = Math.min(types, Math.floor(numbers / 2));
    return clamp(types, MIN_TYPES, MAX_TYPES);
  }

  /**
   * 时间因子 → 实际秒数。原版公式：
   *   t = min(5n, n * (1 + 8 * (255 - f) / 255))
   * f=255 时每张 1 秒（最狠），f=0 时 9 秒/张被封顶到 5 秒（最松）。
   */
  function timeOf(n, f) {
    return Math.min(5 * n, n * (1 + 8 * ((255 - f) / 255)));
  }

  function defaultState() {
    return {
      level: 1, best: 1, numbers: MIN_NUM, types: MIN_TYPES,
      /*
       * 起步给的记忆时间约 2.7 秒/张、还原约 3.6 秒/张。
       * 原版初值 f=0 等于「每张 5 秒」的封顶值，5 张牌就是 25 秒 ——
       * 对第一次玩的孩子来说，光盯着牌等 25 秒就已经走神了。
       * README 里自己估的平均水平也是 2.5 秒/张。
       */
      remF: 200, repF: 160, plays: 0, tutorial: false
    };
  }

  function loadState() {
    var st = defaultState();
    try {
      var raw = localStorage.getItem(SAVE_KEY);
      if (raw) {
        var p = JSON.parse(raw);
        if (p && typeof p === 'object') {
          st.level = clamp(parseInt(p.level, 10) || 1, 1, 999);
          st.best = clamp(parseInt(p.best, 10) || 1, 1, 999);
          st.numbers = clamp(parseInt(p.numbers, 10) || MIN_NUM, MIN_NUM, MAX_NUM);
          st.types = fixTypes(st.numbers, parseInt(p.types, 10) || MIN_TYPES);
          st.remF = clamp(parseInt(p.remF, 10) || 0, 0, 255);
          st.repF = clamp(parseInt(p.repF, 10) || 0, 0, 255);
          st.plays = parseInt(p.plays, 10) || 0;
          st.tutorial = p.tutorial === true;
        }
      }
    } catch (e) { /* 存档坏了就当新玩家，别让孩子卡在启动页 */ }
    return st;
  }

  var ST = loadState();

  function saveState() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(ST)); } catch (e) { /* 隐私模式写不进去，不影响这一局 */ }
  }

  /** 升降级。原版 toTheNextDifficulty：先加种类，种类超过张数/2 再加张数并把种类压回下限。 */
  function harder() {
    // 连对 → 时间收紧一点，但留缓冲，别一下子把孩子逼死
    ST.remF = clamp(ST.remF + 26, 0, 255);
    ST.repF = clamp(ST.repF + 22, 0, 255);
    ST.level++;
    ST.best = Math.max(ST.best, ST.level);

    /*
     * 牌数/种类每两关才动一次。
     * 原版是每次成功都 toTheNextDifficulty()，种类一路 +1 —— 它自己 README 里写，
     * 「增加种类会极大的增大游戏难度」，5 关就到 9 种牌，孩子直接崩。
     * 时间因子仍然每关收紧，难度是连续变化的，只是「换牌」这一步放缓。
     *
     * 判断用 (level - 1) % 2：第一次成功 level 从 1 变 2，这一步不该加牌；
     * 第二次成功变 3，才加。写成 level % 2 会变成每关都加。
     */
    if ((ST.level - 1) % 2 === 0 && !(ST.types >= MAX_TYPES && ST.numbers >= MAX_NUM)) {
      var nextTypes = ST.types + 1;
      if (nextTypes > Math.floor(ST.numbers / 2)) {
        if (ST.numbers < MAX_NUM) {
          ST.numbers++;
          ST.types = fixTypes(ST.numbers, Math.max(MIN_TYPES, Math.ceil(ST.numbers / 3)));
        }
      } else {
        ST.types = fixTypes(ST.numbers, nextTypes);
      }
    }
    return true;
  }

  function easier() {
    ST.level = Math.max(1, ST.level - 1);
    ST.remF = clamp(ST.remF - 45, 0, 255);
    ST.repF = clamp(ST.repF - 40, 0, 255);
    if (ST.remF < 40 && ST.numbers > MIN_NUM) {
      ST.numbers--;
      ST.types = fixTypes(ST.numbers, ST.types);
      ST.remF = clamp(ST.remF + 30, 0, 255);
      ST.repF = clamp(ST.repF + 30, 0, 255);
    }
  }

  /* =========================================================
   * 二、牌面
   * ========================================================= */
  var COLORS = [
    '#E5533D', '#F0862F', '#E0A22E', '#4CAF50', '#26A69A',
    '#3F8CFF', '#5C6BC0', '#8E5CD9', '#D9578F'
  ];

  function cardEl(value, opts) {
    opts = opts || {};
    var d = document.createElement('div');
    d.className = 'card' + (opts.back ? ' back' : '');
    if (opts.back) {
      var q = document.createElement('div');
      q.className = 'n';
      q.textContent = '?';
      d.appendChild(q);
      return d;
    }
    d.style.background = 'linear-gradient(180deg,' + lighten(COLORS[value - 1], 14) + ',' + COLORS[value - 1] + ')';
    var n = document.createElement('div');
    n.className = 'n';
    n.textContent = String(value);
    d.appendChild(n);
    var dot = document.createElement('div');
    dot.className = 'dot';
    d.appendChild(dot);
    return d;
  }

  function lighten(hex, amt) {
    var r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
    r = Math.min(255, r + amt); g = Math.min(255, g + amt); b = Math.min(255, b + amt);
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }

  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  /* =========================================================
   * 三、音效：WebAudio 现场合成，不额外带音频文件
   * ========================================================= */
  var actx = null, muted = false;
  function beep(freq, dur, type, gain) {
    if (muted) return;
    try {
      if (!actx) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        actx = new AC();
      }
      if (actx.state === 'suspended') actx.resume();
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type || 'sine';
      o.frequency.value = freq;
      g.gain.value = gain === undefined ? 0.06 : gain;
      o.connect(g); g.connect(actx.destination);
      var t = actx.currentTime;
      g.gain.setValueAtTime(g.gain.value, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.start(t); o.stop(t + dur + 0.02);
    } catch (e) { /* 没声音比崩了好 */ }
  }
  var SFX = {
    tap: function () { beep(660, 0.06, 'sine', 0.045); },
    ok: function () { beep(880, 0.09, 'triangle', 0.05); },
    bad: function () { beep(180, 0.16, 'sawtooth', 0.05); },
    win: function () { beep(660, 0.1, 'sine', 0.06); setTimeout(function () { beep(880, 0.14, 'sine', 0.06); }, 110); },
    tick: function () { beep(1200, 0.03, 'square', 0.03); }
  };

  /* =========================================================
   * 四、界面
   * ========================================================= */
  var $board = document.getElementById('board');
  var $pool = document.getElementById('pool');
  var $veil = document.getElementById('veil');
  var $sheet = document.getElementById('sheet');
  var $tip = document.getElementById('tip');
  var $bar = document.getElementById('bar');
  var $barFill = document.getElementById('barFill');
  var $sec = document.getElementById('sec');
  var $chipLevel = document.getElementById('chipLevel');
  var $chipDiff = document.getElementById('chipDiff');
  var $best = document.getElementById('best');

  function setChip() {
    $chipLevel.innerHTML = '第 <b>' + ST.level + '</b> 关';
    $chipDiff.textContent = ST.numbers + ' 张 · ' + ST.types + ' 种';
    $best.innerHTML = '最佳 <b>' + ST.best + '</b> 关<br><span>' +
      (ST.plays > 0 ? '玩过 ' + ST.plays + ' 局' : '还没玩过') + '</span>';
  }

  function setTimer(left, total) {
    if (total <= 0) {
      $barFill.style.width = '0%';
      $sec.textContent = '--';
      $bar.className = 'bar'; $sec.className = 'sec';
      return;
    }
    var p = clamp(left / total, 0, 1);
    $barFill.style.width = (p * 100).toFixed(1) + '%';
    $sec.textContent = left.toFixed(1) + 's';
    var cls = left <= 3 ? 'hot' : (left <= Math.min(6, total * 0.35) ? 'warn' : '');
    $bar.className = 'bar' + (cls ? ' ' + cls : '');
    $sec.className = 'sec' + (cls ? ' ' + cls : '');
  }

  function showTip(s) { $tip.textContent = s || ''; }

  function openSheet(html) {
    $sheet.innerHTML = html;
    $veil.classList.remove('hide');
  }
  function closeSheet() { $veil.classList.add('hide'); $sheet.innerHTML = ''; }

  /* =========================================================
   * 五、关卡流程
   * =========================================================
   * remember 关：记忆 → 按顺序还原
   * pair 关：翻牌配对（README 的 Step 2）
   * 每 3 关交替一次，避免「只有一种玩法太单调」。
   */
  var G = {
    kind: 'remember',      // remember | pair
    phase: 'idle',         // remember(记忆) | represent(还原) | pair | idle
    nums: [],              // 正确牌序
    filled: [],            // 已填对的牌
    pool: [],              // 牌堆里剩下的牌（DOM 索引 → 值）
    errors: 0,
    picking: -1,
    startedAt: 0,
    lastTick: 0,
    total: 0,
    left: 0,
    raf: 0,
    running: false,
    // 配对关
    pairs: 0,
    flipOpen: [],
    matched: 0,
    busy: false
  };

  function kindOf(level) { return (level % 3 === 0) ? 'pair' : 'remember'; }

  function stopClock() {
    if (G.raf) { cancelAnimationFrame(G.raf); G.raf = 0; }
    G.running = false;
  }

  function tick() {
    if (!G.running) return;
    var now = performance.now();
    /*
     * 用「累计扣时」而不是「deadline - now」。
     * 用绝对截止时间时，ArkWeb 一旦把 rAF 停掉几秒（页面不重绘、切后台、省电），
     * 恢复后第一帧算出「已经过期」，还原阶段刚亮出来就弹「时间到了」。
     * 每帧最多扣 0.5 秒，宁可慢一点，也不能一进关卡就判负。
     */
    var dt = Math.min(0.5, (now - G.lastTick) / 1000);
    if (dt > 0) G.lastTick = now;
    G.left = Math.max(0, G.left - dt);
    setTimer(G.left, G.total);
    if (G.left <= 0) {
      stopClock();
      /*
       * 三段时间到了要做三件不同的事：
       *   记忆阶段到点 → 不是失败，是「该翻面了」，进入还原阶段（原版就是这个流程）；
       *   还原阶段到点 → 才是没摆完；
       *   配对阶段到点 → 没消完。
       */
      if (G.phase === 'remember') enterRepresent();
      else if (G.phase === 'pair') finishPair(true);
      else finishRemember(true);
      return;
    }
    // 最后 3 秒每秒滴一声，提醒看时间
    var s = Math.ceil(G.left);
    if (s <= 3 && s !== G.lastSec) { G.lastSec = s; SFX.tick(); }
    G.raf = requestAnimationFrame(tick);
  }

  function startClock(seconds) {
    stopClock();
    G.total = seconds;
    G.left = seconds;
    G.lastTick = performance.now();
    G.lastSec = 99;
    G.running = true;
    setTimer(seconds, seconds);
    G.raf = requestAnimationFrame(tick);
  }

  /* ---------- 记忆关 ---------- */
  function startRemember() {
    var n = ST.numbers;
    // 出题：先从 types 种里挑不重复的放到随机位置，剩下的位置从已有种类里随机填。
    // 这样保证「种类数」真的被用满，不会随机出 5 张都是同一个数。
    var types = [];
    for (var i = 0; i < ST.types; i++) types.push(i + 1);
    shuffle(types);

    var nums = new Array(n);
    var idx = shuffle(range(n));
    for (var k = 0; k < ST.types; k++) nums[idx[k]] = types[k];
    for (var j = 0; j < n; j++) {
      if (!nums[j]) nums[j] = types[Math.floor(Math.random() * ST.types)];
    }

    G.kind = 'remember';
    G.phase = 'remember';
    G.nums = nums;
    G.filled = [];
    G.errors = 0;
    G.picking = -1;
    G.startedAt = performance.now();

    $pool.classList.add('hide');
    $pool.innerHTML = '';
    renderBoardRemember(true);
    showTip('看清楚，等下要把它们按顺序摆回来');
    startClock(timeOf(n, ST.remF));
  }

  function range(n) {
    var a = [];
    for (var i = 0; i < n; i++) a.push(i);
    return a;
  }

  function renderBoardRemember(faceUp) {
    var n = G.nums.length;
    // 5~6 张排三列（5 张就成 3+2），7 张以上排四列。
    // 一律 4 列的话，5 张牌会摆成「4 + 孤零零 1 张靠左」，看着像掉了牌。
    var cols = n <= 4 ? n : (n <= 6 ? 3 : 4);
    $board.style.gridTemplateColumns = 'repeat(' + cols + ',minmax(0,1fr))';
    $board.innerHTML = '';
    for (var i = 0; i < n; i++) {
      var slot = document.createElement('div');
      slot.className = 'slot';
      slot.dataset.i = String(i);
      if (faceUp) {
        slot.appendChild(cardEl(G.nums[i]));
      } else {
        var no = document.createElement('div');
        no.className = 'no';
        no.textContent = String(i + 1);
        slot.appendChild(no);
      }
      $board.appendChild(slot);
    }
  }

  function enterRepresent() {
    // 记忆时间到：牌先淡出，再进入「按顺序还原」
    G.phase = 'represent';
    stopClock();
    var cards = $board.querySelectorAll('.card');
    for (var i = 0; i < cards.length; i++) cards[i].classList.add('gone');
    setTimeout(function () {
      renderBoardRemember(false);
      markNextSlot();
      buildPool();
      showTip('点下面的牌，按 1、2、3… 的顺序摆回去');
      startClock(timeOf(ST.numbers, ST.repF));
    }, 260);
  }

  function markNextSlot() {
    var slots = $board.children;
    for (var i = 0; i < slots.length; i++) {
      slots[i].classList.toggle('next', i === G.filled.length);
    }
  }

  function buildPool() {
    var rest = [];
    for (var i = G.filled.length; i < G.nums.length; i++) rest.push(G.nums[i]);
    G.pool = shuffle(rest.slice());
    $pool.innerHTML = '';
    $pool.classList.remove('hide');
    G.pool.forEach(function (v) {
      $pool.appendChild(cardEl(v));
    });
    bindPool();
  }

  /**
   * 牌堆的点击回调只能有一种绑法。
   * 先 addEventListener 再补一个 onclick，两张都会触发 —— 点一下放两张牌，
   * 第二张必然错，孩子怎么点都过不去。统一走 onclick，删牌后整排重绑。
   */
  function bindPool() {
    for (var i = 0; i < $pool.children.length; i++) {
      (function (k) {
        $pool.children[k].onclick = function () { tapPool(k); };
      })(i);
    }
  }

  function tapPool(i) {
    if (!G.running || G.kind !== 'remember') return;
    if (i < 0 || i >= G.pool.length) return;
    var want = G.nums[G.filled.length];
    var got = G.pool[i];
    var node = $pool.children[i];

    if (got !== want) {
      G.errors++;
      SFX.bad();
      if (node) {
        node.classList.add('wrong');
        setTimeout(function () { node.classList.remove('wrong'); }, 360);
      }
      showTip('这张是 ' + got + '，该放 ' + want + ' 哦');
      return;
    }

    // 放对
    SFX.ok();
    G.filled.push(got);
    G.pool.splice(i, 1);
    if (node) node.parentNode.removeChild(node);
    bindPool();

    var slot = $board.children[G.filled.length - 1];
    if (slot) {
      slot.appendChild(cardEl(got));
      slot.classList.remove('next');
    }
    markNextSlot();

    if (G.filled.length >= G.nums.length) {
      finishRemember(false);
    }
  }

  function finishRemember(timeout) {
    stopClock();
    G.running = false;
    G.phase = 'idle';
    var ok = !timeout && G.filled.length === G.nums.length;
    showResult(ok, timeout ? '时间到了' : (G.errors === 0 ? '全对！' : '摆好了'));
  }

  /* ---------- 配对关 ---------- */
  function startPair() {
    var pairs = clamp(4 + Math.floor(ST.level / 2), 4, 8);
    var values = [];
    /*
     * 每种值只能出现两次。
     * 这里原来写的是 clamp(ST.types + 1, 3, 9)，pairs 一旦大于它（第 5 关就是 6 对 4 种），
     * values 里就会有同一个值出现 4 次 —— 棋盘上四张一样的牌，配掉两张还剩两张，
     * 「配对对数」永远数不满，孩子清完所有牌也不结算。
     */
    var typeMax = Math.min(TYPE_COUNT, Math.max(pairs, ST.types + 1));
    for (var i = 0; i < pairs; i++) values.push((i % typeMax) + 1);
    var deck = shuffle(values.concat(values));

    G.kind = 'pair';
    G.phase = 'pair';
    G.pairs = pairs;
    G.flipOpen = [];
    G.matched = 0;
    G.busy = false;
    G.errors = 0;

    $pool.classList.add('hide');
    $pool.innerHTML = '';
    renderBoardPair(deck);
    showTip('翻开两张一样的，就能消掉一对');
    startClock(pairs * 7);
  }

  function renderBoardPair(deck) {
    var cols = deck.length <= 12 ? 4 : 5;
    $board.style.gridTemplateColumns = 'repeat(' + cols + ',minmax(0,1fr))';
    $board.innerHTML = '';
    deck.forEach(function (v, i) {
      var slot = document.createElement('div');
      slot.className = 'slot';
      slot.dataset.v = String(v);
      slot.dataset.i = String(i);
      var back = cardEl(0, { back: true });
      slot.appendChild(back);
      slot.addEventListener('click', function () { tapPair(i); });
      $board.appendChild(slot);
    });
  }

  function tapPair(i) {
    if (!G.running || G.busy || G.kind !== 'pair') return;
    var slot = $board.children[i];
    if (!slot || slot.dataset.done === '1' || slot.dataset.open === '1') return;

    var v = parseInt(slot.dataset.v, 10);
    slot.innerHTML = '';
    slot.dataset.open = '1';
    slot.appendChild(cardEl(v));
    G.flipOpen.push(i);
    SFX.tap();

    if (G.flipOpen.length < 2) return;

    var a = G.flipOpen[0], b = G.flipOpen[1];
    var sa = $board.children[a], sb = $board.children[b];
    if (sa.dataset.v === sb.dataset.v) {
      G.busy = true;
      G.matched++;
      SFX.ok();
      setTimeout(function () {
        if (!G.running) return;   // 计时已经到点结算了，别再补一次
        [sa, sb].forEach(function (s) {
          s.dataset.done = '1';
          var c = s.firstChild;
          if (c) c.classList.add('gone');
        });
        G.flipOpen = [];
        G.busy = false;
        if (G.matched >= G.pairs) finishPair(false);
      }, 260);
    } else {
      G.busy = true;
      G.errors++;
      SFX.bad();
      setTimeout(function () {
        if (!G.running) return;
        [sa, sb].forEach(function (s) {
          s.dataset.open = '';
          s.innerHTML = '';
          s.appendChild(cardEl(0, { back: true }));
        });
        G.flipOpen = [];
        G.busy = false;
      }, 620);
    }
  }

  function finishPair(timeout) {
    stopClock();
    G.running = false;
    G.phase = 'idle';
    showResult(!timeout, timeout ? '时间到了' : '全消完啦');
  }

  /* =========================================================
   * 六、结算 / 上报星星
   * ========================================================= */
  /**
   * 星星：过了给 2 颗，零失误 +1，剩一半时间以上 +1，最多 4 颗。
   * 翻牌配对不额外加码 —— 它本来就是「换换脑子」的一关，难度低，不该和记忆关同价。
   */
  function starsFor(ok, errors, leftRatio) {
    if (!ok) return 0;
    var s = 2;
    if (errors === 0) s++;
    if (leftRatio >= 0.4) s++;
    return clamp(s, 1, 4);
  }

  function award(stars, level, sub) {
    try {
      if (window.KidsSafe && window.KidsSafe.award) {
        window.KidsSafe.award('memory', stars, level, sub);
      }
    } catch (e) { /* 电脑上直接打开时没有桥 */ }
  }

  function showResult(ok, title) {
    ST.plays++;
    var isPair = G.kind === 'pair';
    var ratio = G.total > 0 ? G.left / G.total : 0;
    var stars = starsFor(ok, G.errors, ratio);
    // 上报的 level 必须是「刚打完的这一关」：harder() 会把它 +1，先存下来
    var played = ST.level;

    if (ok) {
      var sub = isPair ? ('配对 ' + G.pairs + ' 对') :
        (G.errors === 0 ? (G.numbers + ' 张全对') : (G.errors + ' 次放错'));
      award(stars, played, sub);
      harder();
    } else {
      easier();
    }
    saveState();
    setChip();

    var starHtml = '';
    for (var i = 0; i < 4; i++) starHtml += '<span class="' + (i < stars ? 'on' : '') + '">⭐</span>';

    var body;
    if (ok) {
      body = '拿到 <b>' + stars + '</b> 颗星星' + (ratio >= 0.4 ? ' · 还剩 ' + G.left.toFixed(1) + ' 秒' : '');
    } else {
      body = '没关系，下一关的牌会更少一点';
    }

    openSheet(
      '<div class="big">' + (ok ? '🎉' : '⏰') + '</div>' +
      '<h2>' + title + '</h2>' +
      '<div class="stars">' + starHtml + '</div>' +
      '<p>' + body + '</p>' +
      '<p style="font-size:12px;color:#A99784">下一关：' + kindName(kindOf(ST.level)) + ' · ' +
      ST.numbers + ' 张 · ' + ST.types + ' 种</p>' +
      '<div class="row"><button class="btn warm" id="btnNext">下一关</button>' +
      '<button class="btn ghost" id="btnHome">先歇会</button></div>'
    );

    document.getElementById('btnNext').onclick = function () { closeSheet(); startLevel(); };
    document.getElementById('btnHome').onclick = function () { closeSheet(); showHome(); };
    SFX.win();
  }

  function kindName(k) { return k === 'pair' ? '翻牌配对' : '记忆还原'; }

  /* =========================================================
   * 七、入口 / 教程
   * ========================================================= */
  function startLevel() {
    if (kindOf(ST.level) === 'pair') startPair();
    else startRemember();
  }

  /** 首页/教程底下的示意牌：不放的话孩子第一个看到的是空白棋盘，不知道这里是干嘛的。 */
  function renderDemoBoard() {
    $board.innerHTML = '';
    $board.style.gridTemplateColumns = 'repeat(4,minmax(0,1fr))';
    [1, 3, 5, 7, 2, 4, 6, 8].forEach(function (v) {
      var slot = document.createElement('div');
      slot.className = 'slot';
      slot.appendChild(cardEl(v));
      $board.appendChild(slot);
    });
    $pool.classList.add('hide');
    $pool.innerHTML = '';
  }

  function showHome() {
    stopClock();
    setChip();
    setTimer(0, 0);
    renderDemoBoard();
    showTip('记住牌面，再按顺序摆回去');

    openSheet(
      '<h2>记住它</h2>' +
      '<p>看一眼牌，牌会翻过去，<br>然后按 <b>1、2、3…</b> 的顺序把它们摆回来。</p>' +
      '<p style="font-size:12px;color:#A99784">现在第 ' + ST.level + ' 关 · ' +
      kindName(kindOf(ST.level)) + ' · ' + ST.numbers + ' 张 / ' + ST.types + ' 种</p>' +
      '<div class="row">' +
      '<button class="btn warm" id="btnStart">开始第 ' + ST.level + ' 关</button>' +
      '<button class="btn ghost" id="btnHow">怎么玩</button>' +
      '</div>'
    );
    document.getElementById('btnStart').onclick = function () { closeSheet(); startLevel(); };
    document.getElementById('btnHow').onclick = function () { showTutorial(); };
  }

  function showTutorial() {
    openSheet(
      '<h2>怎么玩</h2>' +
      '<div class="tut">' +
      '<div class="step"><i>1</i><div><b>先记住</b>：牌面会亮出来，上面有倒计时。<br>' +
      '时间到了它们会自动翻过去，所以别发呆。</div></div>' +
      '<div class="step"><i>2</i><div><b>再摆回去</b>：下面的牌堆是打乱的，' +
      '点一张就放到第 1 格、第 2 格……<br>放错了会抖一下，牌还在，可以再试。</div></div>' +
      '<div class="step"><i>3</i><div><b>每第 3 关换花样</b>：变成翻牌配对，' +
      '翻开两张一样的就消掉。</div></div>' +
      '</div>' +
      '<p style="font-size:12px">做得好，牌会越来越多、种类也会变多；<br>没做好，下一关会退回来一点点。</p>' +
      '<div class="row"><button class="btn" id="btnOk">知道了</button></div>'
    );
    document.getElementById('btnOk').onclick = function () {
      ST.tutorial = true; saveState();
      closeSheet();
      showHome();
    };
  }

  /* =========================================================
   * 八、测试钩子 + 启动
   * ========================================================= */
  window.__mem = {
    state: function () { return ST; },
    reset: function () { ST = defaultState(); saveState(); },
    set: function (patch) {
      for (var k in patch) if (Object.prototype.hasOwnProperty.call(patch, k)) ST[k] = patch[k];
      saveState();
    },
    timeOf: timeOf,
    fixTypes: fixTypes,
    harder: harder,
    easier: easier,
    kindOf: kindOf,
    startLevel: function () { closeSheet(); startLevel(); },
    game: function () { return G; },
    finishRemember: function (timeout) { finishRemember(!!timeout); },
    finishPair: function (timeout) { finishPair(!!timeout); },
    tapPool: function (i) { tapPool(i); },
    tapPair: function (i) { tapPair(i); },
    pool: function () { return G.pool.slice(); },
    nums: function () { return G.nums.slice(); },
    filled: function () { return G.filled.length; },
    closeSheet: closeSheet,
    isSheetOpen: function () { return !$veil.classList.contains('hide'); }
  };

  setChip();
  renderDemoBoard();
  if (!ST.tutorial) {
    // 首次进来先教，别让 5 分钟就走人（原版就栽在这）
    showTutorial();
  } else {
    showHome();
  }
})();
</script>
</body>
</html>
