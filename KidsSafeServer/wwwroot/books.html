<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>电子课本 · 儿童安全桌面</title>
<meta name="description" content="小学语文、数学电子课本在线翻看：一到六年级上下册，人教版、北师大版、苏教版等 11 个版本，支持按页翻阅与 PDF 下载。" />
<style>
  :root{
    --p:#7E57C2; --p2:#5C6BC0; --teal:#26C6DA; --ink:#2E3A4D; --soft:#7A8290;
    --card:#fff; --bg:#F6F1FF; --radius:22px;
    --grad:linear-gradient(135deg,#7E57C2 0%,#26C6DA 100%);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.65;-webkit-font-smoothing:antialiased}
  a{color:var(--p);text-decoration:none}
  .wrap{max-width:1060px;margin:0 auto;padding:0 18px}

  header.nav{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border-bottom:1px solid #EEE5FF}
  .nav .wrap{display:flex;align-items:center;justify-content:space-between;height:60px;gap:12px}
  .brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:17px;color:var(--p);white-space:nowrap}
  .brand span.dot{width:26px;height:26px;border-radius:8px;background:var(--grad);display:inline-block}
  .nav nav{display:flex;gap:16px;font-size:14px;font-weight:600;flex-wrap:wrap}
  .nav nav a{color:var(--ink)}
  .nav nav a:hover,.nav nav a.on{color:var(--p)}

  .hero{padding:34px 0 6px;text-align:center}
  .hero h1{font-size:30px;font-weight:900;line-height:1.25}
  .hero h1 em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero p{color:var(--soft);font-size:15px;margin-top:10px}

  /* ── 筛选条 ── */
  .toolbar{position:sticky;top:60px;z-index:40;background:rgba(246,241,255,.94);backdrop-filter:blur(8px);padding:12px 0 10px;border-bottom:1px solid #EEE5FF}
  .seg{display:inline-flex;flex-wrap:wrap;background:#fff;border:1px solid #ECE3FB;border-radius:999px;padding:4px;gap:4px;box-shadow:0 4px 14px rgba(94,53,177,.06)}
  .subs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  .subs button{display:flex;align-items:center;gap:8px;border:1px solid #ECE3FB;background:#fff;font:inherit;font-size:15px;font-weight:800;color:var(--p2);padding:9px 18px;border-radius:16px;cursor:pointer;box-shadow:0 6px 16px rgba(94,53,177,.07)}
  .subs button .ic{font-size:18px}
  .subs button .cnt{font-size:11.5px;font-weight:700;color:var(--soft);background:#F4EEFE;border-radius:999px;padding:1px 8px}
  .subs button.on{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 8px 18px rgba(126,87,194,.3)}
  .subs button.on .cnt{background:rgba(255,255,255,.22);color:#fff}
  .seg button{border:none;background:transparent;font:inherit;font-size:14px;font-weight:800;color:var(--soft);padding:7px 16px;border-radius:999px;cursor:pointer}
  .seg button.on{background:var(--grad);color:#fff;box-shadow:0 6px 14px rgba(126,87,194,.28)}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
  .chip{border:1px solid #E7DCFA;background:#fff;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700;color:var(--p2);cursor:pointer}
  .chip.on{background:#EFE7FE;border-color:#D6C4F8;color:#5B2AA6}
  .chip.ghost{margin-left:auto;color:var(--soft);border-style:dashed}
  .chip.ghost.on{background:#FFF3E0;border-color:#FFCC80;color:#E65100}

  /* ── 课本卡片 ── */
  .books{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:16px;padding:22px 0 10px}
  .book{background:var(--card);border:1px solid #F1EAFF;border-radius:16px;overflow:hidden;box-shadow:0 10px 24px rgba(94,53,177,.07);display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
  .book:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(94,53,177,.14)}
  .cover{position:relative;background:#F4EEFE;aspect-ratio:870/1229;overflow:hidden}
  .cover img{width:100%;height:100%;object-fit:cover;display:block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
  .cover .badge{position:absolute;left:8px;top:8px;font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.92);color:#8D6E63;border:1px solid #E0D3C8}
  .cover .badge.old{background:#FBE9E7;color:#BF360C;border-color:#FFCCBC}
  .bt{padding:10px 12px 0;font-weight:800;font-size:15px}
  .bm{padding:2px 12px 0;font-size:12px;color:var(--soft)}
  .acts{display:flex;gap:8px;padding:10px 12px 12px;margin-top:auto}
  .mini{flex:1;text-align:center;font:inherit;font-size:13px;font-weight:800;padding:8px 0;border-radius:11px;border:1px solid #E7DCFA;background:#F7F2FF;color:var(--p);cursor:pointer}
  .mini.go{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 6px 14px rgba(126,87,194,.24)}
  .mini:hover{filter:brightness(.98)}

  .empty{font-size:14px;color:var(--soft);background:#FBF8FF;border:1px dashed #E3D8F7;border-radius:14px;padding:22px;text-align:center;margin:22px 0}
  footer{padding:26px 0 44px;text-align:center;color:var(--soft);font-size:12.5px}

  /* ── 阅读器 ── */
  #reader{position:fixed;inset:0;z-index:200;background:#1E1B26;display:none;flex-direction:column}
  #reader.on{display:flex}
  .rbar{display:flex;align-items:center;gap:12px;padding:10px 14px;background:#241F2E;color:#fff;font-size:14px;flex:0 0 auto}
  .rbar .t{font-weight:800}
  .rbar .meta{color:#B9AEC9;font-size:12.5px}
  .rbar .sp{flex:1}
  .rbar button{background:#3A3247;color:#fff;border:none;font:inherit;font-size:13px;font-weight:700;padding:8px 14px;border-radius:10px;cursor:pointer}
  .rbar button:hover{background:#4A4059}
  .stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:8px}
  .stage img{max-width:100%;max-height:100%;width:auto;height:auto;flex:0 1 auto;object-fit:contain;box-shadow:0 10px 40px rgba(0,0,0,.5);background:#fff}
  .navbtn{position:absolute;top:50%;transform:translateY(-50%);width:52px;height:88px;border:none;border-radius:14px;background:rgba(255,255,255,.14);color:#fff;font-size:26px;cursor:pointer;display:grid;place-items:center}
  .navbtn:hover{background:rgba(255,255,255,.26)}
  .navbtn[disabled]{opacity:.25;cursor:not-allowed}
  .navbtn.prev{left:8px}
  .navbtn.next{right:8px}
  .rfoot{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px 14px;background:#241F2E;color:#CFC6DD;font-size:13px}
  .rfoot input[type=range]{flex:1;accent-color:#B388FF}
  .rfoot .pg{font-variant-numeric:tabular-nums;font-weight:800;color:#fff}
  .loading{position:absolute;color:#8E82A0;font-size:13px}

  @media(max-width:760px){
    .hero h1{font-size:24px}
    .nav nav{gap:12px;font-size:13px}
    .brand{font-size:15px}
    .books{grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:12px}
    .chip.ghost{margin-left:0}
    .navbtn{width:42px;height:70px;font-size:22px}
  }
</style>
</head>
<body>

<header class="nav">
  <div class="wrap">
    <div class="brand"><span class="dot"></span>儿童安全桌面</div>
    <nav>
      <a href="index.html">家长后台</a>
      <a href="download.html">下载安装</a>
      <a href="docs.html">服务端说明</a>
      <a class="on" href="books.html">电子课本</a>
    </nav>
  </div>
</header>

<div class="wrap">
  <div class="hero">
    <h1>小学 <em>电子课本</em></h1>
    <p>语文 24 册 · 数学 106 册，11 个教材版本，一年级到六年级上下册，点开就能一页一页翻</p>
  </div>
</div>

<div class="toolbar">
  <div class="wrap">
    <div class="subs" id="subSeg"></div>
    <div class="seg" id="edSeg"></div>
    <div class="chips" id="gradeChips"></div>
  </div>
</div>

<div class="wrap">
  <div class="books" id="bookGrid"></div>
  <div class="empty" id="empty" style="display:none"></div>
  <footer>
    课本页图由服务端预先渲染（120 DPI）。原件 PDF 也放在服务器上，家长可下载打印，仅限家庭内使用。
  </footer>
</div>

<!-- 阅读器 -->
<div id="reader">
  <div class="rbar">
    <span class="t" id="rTitle">—</span>
    <span class="meta" id="rMeta"></span>
    <span class="sp"></span>
    <a id="rPdf" href="#" target="_blank" rel="noopener"><button>下载 PDF</button></a>
    <button id="rClose">关闭 ✕</button>
  </div>
  <div class="stage" id="rStage">
    <img id="rImg" alt="" />
    <div class="loading" id="rLoading" style="display:none">正在翻页…</div>
    <button class="navbtn prev" id="rPrev" title="上一页（←）">‹</button>
    <button class="navbtn next" id="rNext" title="下一页（→）">›</button>
  </div>
  <div class="rfoot">
    <span class="pg" id="rPage">1 / 1</span>
    <input type="range" id="rRange" min="1" max="1" value="1" />
  </div>
</div>

<script>
const CN = ['零','一','二','三','四','五','六'];
let DATA = null;          // /api/books 结果
let subject = null;       // 当前科目：chinese / math
let edition = null;       // 当前版本
let grade = 0;            // 0 = 全部
let hideLegacy = false;
let cur = null;           // 正在阅读的书
let page = 1;

const $ = id => document.getElementById(id);
const gradeText = g => (CN[g] || g) + '年级';

async function boot() {
  try {
    const r = await fetch('/api/books');
    DATA = await r.json();
  } catch (e) {
    showEmpty('读取课本目录失败，请确认服务已启动。');
    return;
  }
  if (!DATA || !DATA.total) {
    showEmpty('还没有课本。把页图放到 wwwroot/books/pages/<书号>/ 并写好 books.json 后刷新本页。');
    return;
  }
  if (!DATA.subjects || !DATA.subjects.length) {
    // 老服务端只给 editions 时，至少还能用
    DATA.subjects = [{ id: 'chinese', name: '语文', icon: '📖' }];
    DATA.editions.forEach(e => e.subject = e.subject || 'chinese');
  }
  subject = DATA.subjects[0].id;

  // 深链：books.html?subject=math 直接进数学；books.html?read=rj-2b&p=36 直接翻到某一页
  const q = new URLSearchParams(location.search);
  const wantSub = q.get('subject');
  if (wantSub && DATA.subjects.some(s => s.id === wantSub)) subject = wantSub;
  const want = q.get('read');
  const wantBook = want ? allBooks().find(b => b.id === want) : null;
  if (wantBook) {
    subject = wantBook.subject || subject;
    edition = wantBook.edition;
  }
  if (!edition || !currentSubjectEditions().some(e => e.id === edition)) {
    edition = currentSubjectEditions()[0]?.id || DATA.editions[0].id;
  }

  renderSubjects();
  renderEditions();
  renderGrades();
  renderBooks();

  if (wantBook) {
    openBook(want);
    const p = parseInt(q.get('p') || '1', 10);
    if (cur && p > 1) showPage(p);
  }
}

function showEmpty(msg) {
  $('empty').style.display = 'block';
  $('empty').textContent = msg;
}

function allBooks() {
  return DATA.editions.flatMap(e => e.books);
}

function currentSubjectEditions() {
  return DATA.editions.filter(e => (e.subject || 'chinese') === subject);
}

function currentEdition() {
  const mine = currentSubjectEditions();
  return mine.find(e => e.id === edition) || mine[0] || DATA.editions[0];
}

function renderSubjects() {
  $('subSeg').innerHTML = DATA.subjects.map(s => {
    const mine = DATA.editions.filter(e => (e.subject || 'chinese') === s.id);
    const cnt = mine.reduce((n, e) => n + e.books.filter(b => !b.legacy).length, 0);
    return `<button data-sub="${s.id}" class="${s.id === subject ? 'on' : ''}">
      <span class="ic">${s.icon || '📚'}</span>${esc(s.name)}<span class="cnt">${cnt} 册</span>
    </button>`;
  }).join('');

  $('subSeg').querySelectorAll('button').forEach(b => b.onclick = () => {
    if (b.dataset.sub === subject) return;
    subject = b.dataset.sub;
    edition = currentSubjectEditions()[0]?.id;
    grade = 0;
    renderSubjects(); renderEditions(); renderGrades(); renderBooks();
  });
}

function renderEditions() {
  const mine = currentSubjectEditions();
  $('edSeg').innerHTML = mine.map(e =>
    `<button data-ed="${e.id}" class="${e.id === edition ? 'on' : ''}">${esc(e.short || e.name)}</button>`).join('');
  $('edSeg').querySelectorAll('button').forEach(b => b.onclick = () => {
    edition = b.dataset.ed;
    grade = 0;
    renderEditions(); renderGrades(); renderBooks();
  });
}

function renderGrades() {
  const ed = currentEdition();
  const max = ed.maxGrade || 6;
  let html = `<span class="chip ${grade === 0 ? 'on' : ''}" data-g="0">全部</span>`;
  for (let g = 1; g <= max; g++) {
    if (!ed.books.some(b => b.grade === g)) continue;   // 五四制没有六年级，别给空年级
    html += `<span class="chip ${grade === g ? 'on' : ''}" data-g="${g}">${gradeText(g)}</span>`;
  }
  html += `<span class="chip ghost ${hideLegacy ? 'on' : ''}" id="legacyChip">只看现行版</span>`;
  $('gradeChips').innerHTML = html;

  $('gradeChips').querySelectorAll('.chip[data-g]').forEach(c => c.onclick = () => {
    grade = +c.dataset.g;
    renderGrades(); renderBooks();
  });
  $('legacyChip').onclick = () => {
    hideLegacy = !hideLegacy;
    renderGrades(); renderBooks();
  };
}

function renderBooks() {
  const list = currentEdition().books
    .filter(b => (grade === 0 || b.grade === grade) && !(hideLegacy && b.legacy));

  if (!list.length) {
    $('bookGrid').innerHTML = '';
    showEmpty('这个年级还没有课本。');
    return;
  }
  $('empty').style.display = 'none';

  $('bookGrid').innerHTML = list.map(b => `
    <div class="book" data-id="${b.id}">
      <div class="cover">
        <img src="${b.cover}" alt="${esc(b.title)}封面" loading="lazy" />
        ${b.legacy ? '<span class="badge old">旧版存档</span>'
                   : (b.year ? `<span class="badge">${esc(b.year)}</span>` : '')}
      </div>
      <div class="bt">${esc(b.title)}</div>
      <div class="bm">${b.pages} 页${b.year ? ' · ' + esc(b.year) : ''}</div>
      <div class="acts">
        <a class="mini" href="${b.pdfUrl}" target="_blank" rel="noopener">PDF</a>
        <button class="mini go" data-read="${b.id}">阅读</button>
      </div>
    </div>`).join('');

  $('bookGrid').querySelectorAll('[data-read]').forEach(btn => {
    btn.onclick = () => openBook(btn.dataset.read);
  });
}

function openBook(id) {
  cur = DATA.editions.flatMap(e => e.books).find(b => b.id === id);
  if (!cur) return;
  page = 1;
  $('rTitle').textContent = cur.editionName + ' · ' + cur.title;
  $('rMeta').textContent = (cur.year ? cur.year + ' · ' : '') + cur.pages + ' 页' + (cur.legacy ? ' · 旧版存档' : '');
  $('rPdf').href = cur.pdfUrl;
  $('rRange').max = cur.pages;
  $('reader').classList.add('on');
  document.body.style.overflow = 'hidden';
  showPage(1);
}

function closeBook() {
  $('reader').classList.remove('on');
  document.body.style.overflow = '';
  $('rImg').src = '';
  cur = null;
}

function showPage(n) {
  if (!cur) return;
  n = Math.max(1, Math.min(cur.pages, n));
  page = n;
  const url = `/books/pages/${cur.id}/page-${String(n).padStart(4, '0')}.jpg`;

  $('rLoading').style.display = 'block';
  const img = $('rImg');
  img.onload = () => { $('rLoading').style.display = 'none'; };
  img.onerror = () => { $('rLoading').textContent = '这一页打不开，试试下一页'; };
  img.src = url;

  $('rPage').textContent = n + ' / ' + cur.pages;
  $('rRange').value = n;
  $('rPrev').disabled = n <= 1;
  $('rNext').disabled = n >= cur.pages;
}

$('rPrev').onclick = () => showPage(page - 1);
$('rNext').onclick = () => showPage(page + 1);
$('rClose').onclick = closeBook;
$('rRange').oninput = e => showPage(+e.target.value);
$('rStage').onclick = e => {
  if (e.target.id === 'rStage' || e.target.id === 'rImg') showPage(page + 1);
};

document.addEventListener('keydown', e => {
  if (!cur) return;
  if (e.key === 'ArrowLeft') { showPage(page - 1); e.preventDefault(); }
  if (e.key === 'ArrowRight' || e.key === ' ') { showPage(page + 1); e.preventDefault(); }
  if (e.key === 'Escape') closeBook();
});

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

boot();
</script>
</body>
</html>
